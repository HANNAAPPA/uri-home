function egSetMode(m){ egStop(); eg.mode=m; egRenderMode(); }
function egTog(k,label){
  return '<label><input type="checkbox" '+(eg.say[k]?'checked':'')+' onchange="eg.say.'+k+'=this.checked"> '+label+'</label>';
}

function egSegList(edit){
  var u=eg.segs.length?eg.segs:(edit?[]:egUnits());
  if(!u.length) return edit?'<div class="eg-note">아직 나눈 문장이 없어요.</div>':'';
  var h='<div class="eg-segs" id="egSegs">';
  u.forEach(function(q,i){
    h+='<div class="eg-seg'+(i===eg.sel?' on':'')+'" id="egSeg'+i+'"><span class="tm">'+(i+1)+'. '+egFmt(q[0])+'</span>';
    if(edit){
      h+='<input value="'+egA(q[2])+'" placeholder="(영어 문장, 선택)" oninput="eg.segs['+i+'][2]=this.value;eg.dirty=true">'
        +'<button onclick="egPrev('+i+')">▶</button><button onclick="egNudge('+i+',-0.3)">−</button>'
        +'<button onclick="egNudge('+i+',0.3)">+</button><button onclick="egSegDel('+i+')">✕</button>';
    } else {
      h+='<span class="tx" onclick="egPick('+i+')">'+(q[2]?esc(q[2]):'<span style="color:#a6adba">('+(q[1]-q[0]).toFixed(1)+'초)</span>')+'</span>'
        +(q[2]&&window.speechSynthesis?'<button onclick="egSpeak('+i+')">🐢</button>':'')
        +'<button onclick="egPick('+i+');egPrev('+i+')">▶</button>';
    }
    h+='</div>';
  });
  return h+'</div>';
}
function egHiSeg(){
  var box=document.getElementById('egSegs'); if(!box) return;
  Array.prototype.forEach.call(box.children,function(el,i){ el.classList.toggle('on',i===eg.sel); });
  var el=document.getElementById('egSeg'+eg.sel);
  if(el) box.scrollTop=el.offsetTop-box.offsetTop-60;
}
function egPick(i){ eg.sel=i; egHiSeg(); }
function egPrev(i){ var u=eg.segs.length?eg.segs:egUnits(); var q=u[i]; if(q){ eg.rate=1; egPlaySeg(q[0],q[1]); } }
function egSpeak(i){
  var u=eg.segs.length?eg.segs:egUnits(), q=u[i]; if(!q||!q[2]||!window.speechSynthesis) return;
  speechSynthesis.cancel();
  var s=new SpeechSynthesisUtterance(q[2]); s.lang='en-US'; s.rate=0.7; speechSynthesis.speak(s);
}

/* ✂ 문장 나누기 */
function egCutStartHere(){ eg.cutStart=Math.round(egT()*10)/10; alert(egFmt(eg.cutStart)+' 부터 첫 문장으로 칠게요'); }
function egCutHere(){
  if(!eg.player) return;
  var t=Math.round(egT()*10)/10;
  var last=eg.segs.length?eg.segs[eg.segs.length-1][1]:eg.cutStart;
  var s=(last<t)?last:Math.max(0,t-3);
  if(t-s<0.4) return;
  eg.segs.push([s,t,'']); eg.sel=eg.segs.length-1; eg.dirty=true;
  egRenderMode();
}
function egNudge(i,d){ var q=eg.segs[i]; q[1]=Math.max(q[0]+0.3,Math.round((q[1]+d)*10)/10); if(eg.segs[i+1]) eg.segs[i+1][0]=q[1]; eg.dirty=true; egRenderMode(); }
function egSegDel(i){ eg.segs.splice(i,1); eg.dirty=true; eg.sel=Math.max(0,Math.min(eg.sel,eg.segs.length-1)); egRenderMode(); }
function egCutReset(){ if(!confirm('나눈 문장을 모두 지울까요? (저장해야 반영돼요)')) return; eg.segs=[]; eg.cutStart=0; eg.dirty=true; egRenderMode(); }
function egSaveSegs(){
  var id=eg.vid.id; busy(true);
  google.script.run.withSuccessHandler(function(d){
    busy(false); if(d&&d.error){ alert(d.error); return; }
    eg.data=d; eg.dirty=false; var v=egFind(id); if(v) eg.vid=v;
    alert('저장했어요 — 문장 '+eg.segs.length+'개'); egRenderMode();
  }).withFailureHandler(function(e){ busy(false); alert('저장 실패: '+e.message); }).eng_saveSegs(id,eg.segs);
}

/* 🔁 반복 */
function egRepToggle(){
  if(eg.rep.on){ egStop(); egRenderMode(); return; }
  egUnlock();
  var u=egUnits(), q=u[eg.sel]; if(!q){ alert('영상이 아직 준비 안 됐어요. 잠깐 뒤에 다시 눌러 주세요.'); return; }
  eg.rep.on=true; eg.rep.left=eg.rep.n; eg.rate=eg.rep.speed;
  document.getElementById('egRepBtn').textContent='■ 멈춤';
  (function loop(){
    if(!eg.rep.on) return;
    egPlaySeg(q[0],q[1],function(){
      eg.rep.left--;
      if(eg.rep.n===99||eg.rep.left>0) eg.rep.timer=setTimeout(loop,800);
      else { eg.rep.on=false; eg.rate=1; var b=document.getElementById('egRepBtn'); if(b) b.textContent='🔁 선택한 문장 반복'; }
    });
  })();
}

/* 🗣 따라 말하기 */
function egSR(){ return window.SpeechRecognition||window.webkitSpeechRecognition; }
function egAudio(){ if(!eg.audio){ eg.audio=new Audio(); eg.audio.setAttribute('playsinline',''); } return eg.audio; }
function egSilentWav(){
  var n=800, b=new ArrayBuffer(44+n), v=new DataView(b);
  var s=function(o,t){ for(var i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  s(0,'RIFF'); v.setUint32(4,36+n,true); s(8,'WAVE'); s(12,'fmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,8000,true); v.setUint32(28,8000,true);
  v.setUint16(32,1,true); v.setUint16(34,8,true); s(36,'data'); v.setUint32(40,n,true);
  for(var i=0;i<n;i++) v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
// 아이폰은 첫 소리를 손가락 터치 안에서 내야 뒤에 이어지는 소리도 허락된다
function egUnlock(){
  var AC=window.AudioContext||window.webkitAudioContext;
  if(AC){ if(!eg.ctx) eg.ctx=new AC(); if(eg.ctx.state==='suspended') eg.ctx.resume(); }
  var a=egAudio(); if(!a.src){ a.src=egSilentWav(); a.play().catch(function(){}); }
  if(window.speechSynthesis){ var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }
}
function egWake(on){
  try{
    if(on&&navigator.wakeLock&&!eg.wake) navigator.wakeLock.request('screen').then(function(w){ eg.wake=w; }).catch(function(){});
    if(!on&&eg.wake){ eg.wake.release(); eg.wake=null; }
  }catch(e){}
}

function egOv(){
  var o=document.getElementById('egTurn');
  if(!o){
    o=document.createElement('div'); o.className='eg-turn'; o.id='egTurn';
    o.innerHTML='<div class="eg-burst" id="egBurst"></div><div class="msg" id="egMsg"></div><div class="sen" id="egSen"></div>'
      +'<div class="eg-mic" id="egMic">🎤</div><div class="heard" id="egHeard"></div>'
      +'<div class="row"><button class="again" onclick="egAgain()">🔁 한 번 더</button>'
      +'<button class="next" id="egNextBtn" onclick="egNext()">다 했어 ➡</button></div>'
      +'<div class="row"><button class="quit" onclick="egSayStop()">그만하기</button></div>';
    document.body.appendChild(o);
  }
  return o;
}
function egOvSet(o){
  if(o.msg!=null) document.getElementById('egMsg').textContent=o.msg;
  if(o.sen!=null) document.getElementById('egSen').textContent=o.sen;
  if(o.heard!=null) document.getElementById('egHeard').innerHTML=o.heard;
  if(o.burst!=null){ var b=document.getElementById('egBurst'); b.textContent=o.burst; b.classList.remove('go'); void b.offsetWidth; if(o.burst) b.classList.add('go'); }
  if(o.mic!=null){ var m=document.getElementById('egMic'); m.className='eg-mic'+(o.mic?' '+o.mic:''); m.textContent=o.mic==='play'?'🔊':(o.mic==='done'?'👍':'🎤'); m.style.boxShadow=''; }
}
function egOvHide(){ var o=document.getElementById('egTurn'); if(o) o.classList.remove('on'); }

function egSayStart(){
  egUnlock();
  var u=egUnits();
  if(!u.length){ alert('영상이 아직 준비 안 됐어요. 잠깐 뒤에 다시 눌러 주세요.'); return; }
  eg.units=u; eg.say.running=true; eg.say.idx=Math.min(eg.sel,u.length-1); eg.quietTries=0; eg.rate=1;
  egWake(true); egSayStep();
}
function egSayStep(){
  if(!eg.say.running) return;
  var u=eg.units[eg.say.idx];
  if(!u){ egSayStop(true); return; }
  eg.sel=eg.say.idx; egHiSeg(); egOvHide(); eg.phase='listen';
  var play=function(k){
    egPlaySeg(u[0],u[1],function(){
      if(!eg.say.running) return;
      if(k>1) eg.autoTimer=setTimeout(function(){ play(k-1); },600);
      else egTurnMic(u);
    });
  };
  play(eg.say.twice?2:1);
}
function egTurnMic(u){
  egOv().classList.add('on');
  egOvSet({msg:'따라 해 봐! 🎤', sen:u[2]||'', heard:'', burst:'', mic:''});
  document.getElementById('egNextBtn').textContent='다 했어 ➡';
  if(eg.say.stt&&egSR()) egListenSTT(u); else egRecord(u);
}

function egRecord(u){
  eg.phase='rec';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    eg.phase='noRec'; egOvSet({heard:'이 기기에선 녹음이 안 돼요 — 따라 말하면 「다 했어」를 눌러 주세요'}); return;
  }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(st){
    if(!eg.say.running||eg.phase!=='rec'){ st.getTracks().forEach(function(t){ t.stop(); }); return; }
    eg.mic=st;
    var mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].filter(function(m){
      return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m); })[0];
    var rec=new MediaRecorder(st, mt?{mimeType:mt}:undefined), chunks=[];
    eg.rec=rec;
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      var spoke=eg.heardVoice;
      egMicOff();
      egAfterRec(u, new Blob(chunks,{type:rec.mimeType||mt||'audio/mp4'}), spoke);
    };
    rec.start();
    egVad(st);
    eg.recTimer=setTimeout(egRecStop,8000);
  }).catch(function(){
    eg.phase='noRec'; egOvSet({heard:'마이크를 쓸 수 없어요 — 허용해 주세요. 따라 말하면 「다 했어」를 눌러 주세요'});
  });
}
// 목소리 크기로 마이크를 부풀리고, 말이 끝나면(1.3초 조용) 알아서 멈춘다
function egVad(st){
  eg.heardVoice=false;
  if(!eg.ctx) return;
  if(eg.ctx.state==='suspended') eg.ctx.resume();
  var src=eg.ctx.createMediaStreamSource(st), an=eg.ctx.createAnalyser(); an.fftSize=512; src.connect(an);
  eg.vadSrc=src;
  var buf=new Uint8Array(an.fftSize), quiet=0, t0=Date.now(), mic=document.getElementById('egMic');
  clearInterval(eg.vadTimer);
  eg.vadTimer=setInterval(function(){
    an.getByteTimeDomainData(buf);
    var sum=0; for(var i=0;i<buf.length;i++){ var v=(buf[i]-128)/128; sum+=v*v; }
    var rms=Math.sqrt(sum/buf.length), now=Date.now();
    if(mic) mic.style.boxShadow='0 0 0 '+Math.min(70,Math.round(rms*500))+'px rgba(239,68,68,.35)';
    if(rms>0.035&&now-t0>300){ eg.heardVoice=true; quiet=0; }
    else if(eg.heardVoice){ if(!quiet) quiet=now; else if(now-quiet>1300) egRecStop(); }
    else if(now-t0>5000) egRecStop();
  },60);
}
function egRecStop(){
  clearTimeout(eg.recTimer); clearInterval(eg.vadTimer);
  if(eg.sr){ try{ eg.sr.stop(); }catch(e){} }
  if(eg.rec&&eg.rec.state!=='inactive'){ try{ eg.rec.stop(); }catch(e){} }
}
function egMicOff(){
  clearInterval(eg.vadTimer);
  if(eg.vadSrc){ try{ eg.vadSrc.disconnect(); }catch(e){} eg.vadSrc=null; }
  if(eg.mic){ eg.mic.getTracks().forEach(function(t){ t.stop(); }); eg.mic=null; }   // 마이크를 꺼야 영상 소리가 다시 커진다
  eg.rec=null;
}

function egAfterRec(u, blob, spoke){
  if(!eg.say.running||eg.phase!=='rec') return;
  if(!spoke){
    eg.phase='quiet'; eg.quietTries++;
    egOvSet({msg:eg.quietTries>=2?'다음 문장으로 가 볼까?':'다시 들어볼까? 👂', heard:'', mic:''});
    eg.autoTimer=setTimeout(function(){
      if(eg.phase!=='quiet'||!eg.say.running) return;
      if(eg.quietTries>=2) egAdvance(); else egSayStep();
    },1400);
    return;
  }
  eg.quietTries=0;
  if(eg.say.back&&blob&&blob.size){
    eg.phase='play'; egOvSet({msg:'내 목소리! 🔊', mic:'play'});
    var a=egAudio(), url=URL.createObjectURL(blob);
    a.onended=function(){ URL.revokeObjectURL(url); if(eg.phase==='play') egDone(); };
    a.src=url; a.play().catch(function(){ if(eg.phase==='play') egDone(); });
  } else egDone();
}

var EG_PRAISE=['Great job!','Wonderful!','Good job!','Yay!','Awesome!','Super!','Well done!'];
var EG_BURST=['🌟🌟🌟','🎉⭐🎉','👏👏👏','🦄✨🌈','🐷💕🐷','🚀⭐🚀'];
function egDone(){
  if(!eg.say.running) return;
  eg.phase='praise';
  egOvSet({msg:'잘했어!', mic:'done', burst:EG_BURST[Math.floor(Math.random()*EG_BURST.length)]});
  if(window.speechSynthesis){
    speechSynthesis.cancel();
    var s=new SpeechSynthesisUtterance(EG_PRAISE[Math.floor(Math.random()*EG_PRAISE.length)]);
    s.lang='en-US'; s.rate=0.95; s.pitch=1.3; speechSynthesis.speak(s);
  }
  eg.say.said++;
  google.script.run.withSuccessHandler(function(r){ if(eg.data&&r) eg.data.log=r.log; }).eng_logSay(1);
  document.getElementById('egNextBtn').textContent='다음 ➡';
  if(eg.say.auto) eg.autoTimer=setTimeout(function(){ if(eg.phase==='praise') egAdvance(); },2400);
}
function egAdvance(){ clearTimeout(eg.autoTimer); eg.say.idx++; eg.quietTries=0; egSayStep(); }
function egCancelTurn(){
  clearTimeout(eg.autoTimer); clearTimeout(eg.recTimer); clearInterval(eg.timer);
  var was=eg.phase; eg.phase='cancel';
  if(was==='rec') egRecStop();
  egMicOff();
  if(eg.audio){ try{ eg.audio.pause(); }catch(e){} }
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function egNext(){
  if(eg.phase==='rec'){ egRecStop(); return; }     // 말이 끝났다 → 들려주기로
  if(eg.phase==='noRec'){ egDone(); return; }
  egCancelTurn(); egAdvance();
}
function egAgain(){ egCancelTurn(); eg.quietTries=0; egSayStep(); }

function egSayStop(finished){
  var said=eg.say.said, was=eg.say.running;
  eg.say.running=false; egCancelTurn(); egOvHide(); egWake(false);
  try{ if(eg.player&&eg.player.pauseVideo) eg.player.pauseVideo(); }catch(e){}
  if(was&&said){ alert((finished?'끝까지 했어요! ':'')+'이번에 '+said+'문장 따라 말했어요 🌟'); }
  eg.say.said=0;
}

// 받아쓰기(베타) — 아이 발음은 잘 못 알아들어서 기본은 끔
function egListenSTT(u){
  eg.phase='rec';
  var SR=egSR(), r=new SR(), got='', ended=false;
  r.lang='en-US'; r.interimResults=true; r.maxAlternatives=1; eg.sr=r;
  r.onresult=function(e){
    got=''; for(var i=0;i<e.results.length;i++) got+=e.results[i][0].transcript+' ';
    egOvSet({heard:egMatch(got,u[2])});
  };
  r.onerror=function(){};
  r.onend=function(){
    if(ended) return; ended=true; eg.sr=null; clearTimeout(eg.recTimer);
    if(eg.phase!=='rec'||!eg.say.running) return;
    if(got.trim()) egDone(); else egAfterRec(u,null,false);
  };
  try{ r.start(); }catch(e){ egRecord(u); return; }
  eg.recTimer=setTimeout(function(){ try{ r.stop(); }catch(e){} },6000);
}
function egMatch(got,target){
  var want={}; (target||'').toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).forEach(function(w){ if(w) want[w]=1; });
  return got.trim().split(/\s+/).map(function(w){
    var k=w.toLowerCase().replace(/[^a-z']/g,'');
    return want[k]?'<b>'+esc(w)+'</b>':esc(w);
  }).join(' ');
}

// 탭을 떠나거나 모드를 바꿀 때 전부 멈춘다
function egStop(){
  if(eg.say.running) egSayStop();
  egCancelTurn(); egOvHide();
  eg.rep.on=false; clearTimeout(eg.rep.timer); eg.rate=1;
  try{ if(eg.player&&eg.player.pauseVideo) eg.player.pauseVideo(); }catch(e){}
}
</script>
