<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src https://script.google.com https://script.googleusercontent.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; media-src 'self' blob: data:; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리집">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>우리집</title>
<script src="shim.js"></script>
<style>header{padding-top:env(safe-area-inset-top)}body{padding-bottom:env(safe-area-inset-bottom)}</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#e5e8ee;--muted:#8a93a3;--txt:#1f2733;--blue:#2563eb;--green:#0f9d58;--red:#e5484d;--gray:#9aa3b2;--pink:#ec4899;--once:#7c3aed;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:5;}
.hd{padding:12px 18px 0;display:flex;align-items:center;gap:12px;}
.hd h1{font-size:18px;margin:0;}
.hd .today{color:var(--muted);font-size:13px;}
.hd button.rf{margin-left:auto;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;}
.hd button.rf:disabled{opacity:.5;cursor:default;}
.tabs{display:flex;gap:2px;padding:0 10px;overflow-x:auto;}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.tab.on{color:var(--txt);border-bottom-color:var(--blue);font-weight:700;}
.wrap{max-width:1100px;margin:0 auto;padding:18px;}
.wrap.wide{max-width:1460px;padding:18px 14px;}   /* 🌏 여행 3단 — 좌우 여백을 줄인다 */
.state{padding:40px;text-align:center;color:var(--muted);}
.pane{display:none;}
.pane.on{display:block;}
.empty{color:var(--muted);font-size:14px;}
h3{font-size:15px;margin:0 0 12px;}

/* 홈 레이아웃 (2단) */
.homegrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(240px,.9fr);gap:16px;align-items:start;}
@media(max-width:720px){.homegrid{grid-template-columns:1fr;}}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.rc h3{font-size:14px;}

/* 캘린더 (컴팩트) */
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px;}
.calhd{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;font-size:15px;font-weight:700;}
.calhd button{background:none;border:1px solid var(--line);border-radius:7px;width:28px;height:28px;font-size:13px;cursor:pointer;color:var(--txt);}
.calhd button:hover{border-color:var(--blue);}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.calw{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;font-weight:600;}
.calw.sun{color:var(--red);}
.calc{aspect-ratio:1/1;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.calc:hover{background:var(--bg);}
.calc.empty,.calc.empty:hover{cursor:default;background:none;}
.calc .cn{font-size:12px;}
.calc.sun .cn{color:var(--red);}
.calc.today{background:var(--blue);}
.calc.today .cn{color:#fff;font-weight:700;}
.calc.today.sun .cn{color:#fff;}
.calc.sel{outline:2px solid var(--blue);outline-offset:-2px;}
.caldots{display:flex;gap:2px;}
.dot{width:4px;height:4px;border-radius:50%;background:var(--pink);}
.calc.today .dot{background:#fff;}
.daypanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
.daypanel h4{margin:0 0 6px;font-size:13px;}
.dpev{padding:5px 0;border-top:1px solid var(--line);font-size:13px;display:flex;gap:8px;}
.dpev:first-of-type{border-top:0;}
.dpev .tm{color:var(--muted);width:44px;flex:none;}
.dpadd{display:flex;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
.dpadd input[type=time]{width:88px;flex:none;}
.dpadd input[type=text]{flex:1;min-width:0;}
.dpadd input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;}
.dpadd button{background:var(--pink);color:#fff;border:0;border-radius:7px;width:34px;flex:none;font-size:16px;cursor:pointer;}
.dpadd button:disabled{opacity:.5;}

/* 다가오는 일정 */
.leg{display:flex;gap:12px;margin:-2px 0 8px;font-size:11px;color:var(--muted);}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.leg .lb{background:var(--txt);}
.leg .lo{background:var(--once);}
.up{display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline;}
.up:first-of-type{border-top:0;}
.up .ud{width:70px;flex:none;font-weight:600;}
.up .ut{color:var(--muted);width:38px;flex:none;font-size:12px;}
.up .un{flex:1;}
.up .un.once,.dpev .once{color:var(--once);}

/* 기념일 */
.ddrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);}
.ddrow:first-of-type{border-top:0;}
.ddbadge{flex:none;min-width:48px;text-align:center;font-weight:700;font-size:12px;padding:3px 6px;border-radius:7px;background:var(--bg);color:var(--muted);}
.ddbadge.dsoon{background:#fef3c7;color:#b45309;}
.ddbadge.dnow{background:var(--red);color:#fff;}
.ddname{flex:1;font-size:14px;}
.ddname .yrs{color:var(--pink);font-size:11px;margin-left:5px;}
.dddate{color:var(--muted);font-size:12px;}
.ddx{background:none;border:0;color:var(--gray);font-size:17px;cursor:pointer;line-height:1;padding:0 3px;}
.ddx:hover{color:var(--red);}
.ddadd{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.ddadd input[type=text]{flex:1;min-width:100px;}
.ddadd input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;}
.ddadd label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);}
.ddadd button{background:var(--pink);color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer;}

/* 공유 메모 */
.memo textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;resize:vertical;}
.memobar{display:flex;align-items:center;gap:10px;margin-top:8px;}
.memobar button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:7px 16px;font-size:14px;cursor:pointer;}
.memobar button:disabled{opacity:.5;}
.memobar .mt{color:var(--muted);font-size:12px;}

/* 키즈카페 */
.fclty{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;}
.fclty h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.fclty h2 a{color:var(--blue);text-decoration:none;font-size:12px;font-weight:600;border:1px solid var(--blue);border-radius:6px;padding:3px 8px;}
.fclty h2 a:hover{background:var(--blue);color:#fff;}
.row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;flex-wrap:wrap;}
.row:first-of-type{border-top:0;}
.date{width:120px;flex:none;font-weight:600;font-size:14px;}
.dow{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px;}
.slots{display:flex;gap:8px;flex-wrap:wrap;}
.slot{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;white-space:nowrap;text-decoration:none;color:inherit;}
a.slot:hover{border-color:var(--blue);}
.slot b{font-weight:600;}
.slot .t{color:var(--muted);margin:0 4px;}
.left{color:var(--green);font-weight:700;}
.left.low{color:#d97706;}
.full{color:var(--red);font-weight:700;}
.prog,.holi{color:var(--gray);}

/* 아이 */
.wk{margin-bottom:20px;}
.wk h3{color:var(--pink);}
.ev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:baseline;}
.ev .d{width:96px;flex:none;font-weight:600;font-size:14px;}
.ev .tm{width:52px;flex:none;color:var(--muted);font-size:13px;}
.ev .ttl{font-size:15px;}
.hint{background:#fdf2f8;border:1px solid #fbcfe8;border-radius:12px;padding:14px 16px;font-size:13px;color:#9d174d;margin-bottom:16px;line-height:1.6;}
.hint b{color:#831843;}

/* 부동산 */
.setup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;line-height:1.8;font-size:14px;}
.setup h3{font-size:17px;}
.setup ol{margin:0;padding-left:20px;}
.setup a{color:var(--blue);}
.re-err{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px 14px;font-size:13px;color:#9a3412;margin-bottom:14px;}
.aptcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
.aptcard h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
.aptcard .addr{font-size:12px;color:var(--muted);margin-bottom:10px;}
.retag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;flex:none;}
.retag.own{background:#eff6ff;color:var(--blue);}
.retag.watch{background:#fdf2f8;color:var(--pink);}
.re-delx{background:none;border:0;color:var(--gray);font-size:14px;cursor:pointer;margin-left:auto;padding:0 4px;}
.re-delx:hover{color:var(--red);}
.re-addform{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.re-addform h3{font-size:14px;margin:0 0 10px;}
.re-addform .row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;}
.re-addform .f{flex:1;min-width:110px;}
.re-addform label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.re-addform input,.re-addform select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;}
.re-addform button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;white-space:nowrap;}
.deal{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline;}
.deal:first-of-type{border-top:0;}
.deal .dd{width:96px;flex:none;color:var(--muted);}
.deal .amt{font-weight:700;width:110px;flex:none;}
.deal .meta{color:var(--muted);font-size:13px;}
.re-loan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;}
.re-loan h3{font-size:15px;margin:0 0 12px;}
.re-loan .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
@media(max-width:640px){.re-loan .grid{grid-template-columns:1fr;}}
.re-loan label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.re-loan input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;}
.re-loan .note{font-size:11px;color:var(--gray);margin:2px 0 12px;line-height:1.5;}
.re-loan .out{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:640px){.re-loan .out{grid-template-columns:1fr;}}
.re-loan .out .b{background:var(--bg);border-radius:10px;padding:10px 12px;}
.re-loan .out .lab{font-size:12px;color:var(--muted);}
.re-loan .out .val{font-size:17px;font-weight:800;}
.re-loan .out .b.ok{background:#ecfdf3;}
.re-loan .out .b.bad{background:#fef2f2;}
#reMap{height:280px;border-radius:14px;overflow:hidden;margin-bottom:8px;background:var(--line);}
.re-maplab{font-size:12px;color:var(--muted);margin-bottom:16px;}
.re-pin{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);}
.re-pin.own{background:var(--blue);}
.re-pin.watch{background:var(--pink);}
@media(max-width:560px){.date{width:100%}.ev .ttl{flex:1}}

/* 📈 포트폴리오 */
.pf-top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.pf-top .net{font-size:15px;color:var(--muted);}
.pf-top .net b{font-size:22px;color:var(--txt);margin-left:6px;}
.pf-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
@media(max-width:820px){.pf-tiles{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.pf-tiles{grid-template-columns:repeat(2,1fr);}}
.pf-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.pf-tile .lab{font-size:12px;color:var(--muted);margin-bottom:6px;}
.pf-tile .val{font-size:18px;font-weight:800;}
.pf-tile .tsub{font-size:11px;color:var(--muted);margin-top:3px;}
.pf-tile.hl{background:#ecfdf3;border-color:#bbf7d0;}
.pos{color:var(--red);}   /* +손익=빨강(국내 관행) */
.neg{color:var(--blue);} /* -손익=파랑 */
.pf-analysis{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
@media(max-width:760px){.pf-analysis{grid-template-columns:1fr;}}
.pf-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
.pf-card h3{font-size:14px;}
.donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.legend{flex:1;min-width:150px;font-size:13px;}
.legend .lgr{display:flex;align-items:center;gap:7px;padding:3px 0;}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none;}
.legend .lgn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.legend .lgp{color:var(--muted);margin-left:6px;}
.legend .lgv{color:var(--txt);font-weight:600;margin-left:8px;}
.barrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;}
.barrow .bn{width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.barrow .bt{flex:1;background:var(--bg);border-radius:5px;height:16px;position:relative;overflow:hidden;}
.barrow .bf{position:absolute;top:0;bottom:0;border-radius:5px;}
.barrow .bv{width:64px;flex:none;text-align:right;font-weight:600;}
.pf-sech{font-size:13px;color:var(--muted);margin:6px 0 8px;font-weight:700;}
.pf-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.pf-sum.pf-sum3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:560px){.pf-sum.pf-sum3{grid-template-columns:1fr;}}
.pf-sum .b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
.pf-sum .b .lab{font-size:12px;color:var(--muted);}
.pf-sum .b .val{font-size:16px;font-weight:800;}
.pf-tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;margin-bottom:18px;}
.pf-tbl th,.pf-tbl td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
.pf-tbl th{background:#f8fafc;color:var(--muted);font-weight:600;font-size:12px;}
.pf-tbl td.nm,.pf-tbl th.nm{text-align:left;font-weight:600;}
.pf-tbl tr:last-child td{border-bottom:0;}
.pf-tbl .noqt{color:var(--gray);}
.pf-scroll{overflow-x:auto;}
.pf-editbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--txt);}
.pf-editbtn:hover{border-color:var(--blue);}
.pf-edit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;}
.pf-edit table{width:100%;border-collapse:collapse;font-size:13px;}
.pf-edit th,.pf-edit td{padding:5px 4px;border-bottom:1px solid var(--line);}
.pf-edit th{color:var(--muted);font-size:11px;font-weight:600;text-align:left;}
.pf-edit input,.pf-edit select{border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:13px;width:100%;font-family:inherit;}
.pf-edit .delx{background:none;border:0;color:var(--gray);font-size:16px;cursor:pointer;}
.pf-edit .delx:hover{color:var(--red);}
.buyb{background:none;border:1px solid var(--line);border-radius:6px;color:var(--green);font-size:12px;cursor:pointer;padding:3px 6px;margin-right:4px;}
.buyb:hover{border-color:var(--green);}
.buylot td{background:#f0faf3;}
.lotbox{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--txt);padding:2px 0;}
.lotbox input{width:88px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:13px;}
.lotbox .lotap{background:var(--green);color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;}
.lotbox .lotcx{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--muted);}
.lotbox .lotmsg{color:var(--red);font-size:12px;}
#pfFxBox .lotbox{margin-top:8px;}
.pf-editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;}
.pf-editbar .cashin{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
.pf-editbar .cashin input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;width:130px;text-align:right;}
.pf-editbar .save{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;margin-left:auto;}
.pf-editbar .addr{background:var(--green);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;}
.pf-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6;}

/* 📈 성과 추이 (내 계좌 vs 시장) */
.pf-tiles.t3{grid-template-columns:repeat(3,1fr);}
.pf-tiles.t5{grid-template-columns:repeat(5,1fr);}
@media(max-width:1000px){.pf-tiles.t5{grid-template-columns:repeat(3,1fr);}}
@media(max-width:640px){.pf-tiles.t5{grid-template-columns:repeat(2,1fr);}}
.pf-tiles.t6{grid-template-columns:repeat(6,1fr);}
@media(max-width:1100px){.pf-tiles.t6{grid-template-columns:repeat(3,1fr);}}
@media(max-width:640px){.pf-tiles.t6{grid-template-columns:repeat(2,1fr);}}
.pf-tiles.t7{grid-template-columns:repeat(4,1fr);}
@media(max-width:1100px){.pf-tiles.t7{grid-template-columns:repeat(3,1fr);}}
@media(max-width:640px){.pf-tiles.t7{grid-template-columns:repeat(2,1fr);}}
.rp-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0;}
.rp-row input{padding:5px 7px;border:1px solid #d4d4d8;border-radius:6px;font-size:13px;}
.rp-row .rp-nm{width:120px} .rp-row .rp-am{width:110px}
.rp-row .rp-rt{width:66px} .rp-row .rp-st{width:130px} .rp-row .rp-dy{width:64px}
.rp-row .rp-lb{font-size:12px;color:#71717a}
.hs-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;}
.hs-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.hs-hd h3{margin:0;font-size:14px;}

.hs-hd .acts button.on{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6;font-weight:700;}

.hs-leg .nm{color:var(--muted);}

/* 그래프 너비는 JS(hsAvailW)가 화면·달수에 맞춰 정한다 — 달이 적으면 화면에 꽉 채우고(스크롤 없음),
   달이 많아 글씨가 빽빽해질 때만 실제 필요한 폭으로 늘려 가로로 넘긴다(옛날: 무조건 700px 고정 → 달이
   2개뿐이어도 스크롤이 생기고 오른쪽에 빈 칸이 보였다). */
.hs-plot{position:relative;margin-top:4px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
.hs-plot svg{display:block;overflow:visible;}
.hs-tip{position:absolute;pointer-events:none;background:#1f2733;color:#fff;border-radius:9px;padding:8px 11px;font-size:12px;line-height:1.65;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.18);}
.hs-tip.on{opacity:1;}
.hs-tip b{font-size:12.5px;}
.hs-tip .tl{display:flex;align-items:center;gap:6px;}
.hs-tip .tl .d{width:8px;height:8px;border-radius:50%;flex:none;}
.hs-tip .tl .k{opacity:.75;}
.hs-tip .tl .v{margin-left:auto;font-weight:700;padding-left:12px;}
.hs-tip .ex{opacity:.7;font-size:11px;margin-top:3px;border-top:1px solid rgba(255,255,255,.2);padding-top:3px;}
.hs-tb{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
.hs-tb th,.hs-tb td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
.hs-tb th{background:#f8fafc;color:var(--muted);font-weight:600;font-size:11.5px;}
.hs-tb td.m,.hs-tb th.m{text-align:left;font-weight:700;}
.hs-tb input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12.5px;width:112px;text-align:right;font-family:inherit;}
.hs-tb input.fl{width:88px;}
.hs-tb tr.cur td{background:#f5f3ff;}
.hs-tb .sv{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;font-family:inherit;}
.hs-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.65;}
.hs-warn{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 11px;font-size:12.5px;color:#92400e;margin-top:10px;}

/* 여행 */
.tv-hero{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:16px;}
.tv-hero h2{margin:0;font-size:19px;}
.tv-hero .sub{opacity:.85;font-size:13px;margin-top:3px;}
.tv-dday{float:right;text-align:center;background:rgba(255,255,255,.18);border-radius:12px;padding:7px 14px;font-weight:800;font-size:17px;}
/* 맨 위 항공·숙소 | 예산 · 맨 아래 메모·준비물·참고 */
.tv-top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start;}
.tv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start;margin-top:6px;}
/* 📅 날짜 탭 */
.tv-dtabs{display:flex;gap:8px;margin:4px 0 12px;}
.tv-dtabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 6px;cursor:pointer;
  font-family:inherit;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;}
.tv-dtabs button b{font-size:14px;}
.tv-dtabs button small{font-size:11px;color:var(--muted);}
.tv-dtabs button span{position:absolute;top:5px;right:8px;font-size:10px;color:var(--muted);}
.tv-dtabs button.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.tv-dtabs button.on small,.tv-dtabs button.on span{color:rgba(255,255,255,.85);}
.tv-dpane.hide{display:none;}
.tv-dgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start;}
.tv-go{display:inline-block;margin-top:4px;font-size:11.5px;color:var(--blue);text-decoration:none;
  background:#eef4ff;border-radius:6px;padding:2px 7px;}
.tv-dpane .tv-sug .sw{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;}
.tv-dpane .tv-sug .sw.open{display:block;}
.tv-wish .wp{background:none;border:1px solid var(--line);border-radius:6px;font-size:11px;padding:2px 6px;
  cursor:pointer;color:var(--blue);flex:none;font-family:inherit;}
@media(max-width:900px){
  .tv-dgrid,.tv-grid{grid-template-columns:1fr;}
}
@media(max-width:700px){
  .tv-top{grid-template-columns:1fr;}
}

<body>
<header>
  <div class="hd">
    <h1>🏠 가정 경영 대시보드</h1>
    <span class="today" id="today"></span>
    <button class="rf" id="refresh" onclick="reloadCurrent()">새로고침</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="home" onclick="switchTab('home')">🏠 홈</button>
    <button class="tab" data-tab="kids" onclick="switchTab('kids')">🧸 키즈카페</button>
    <button class="tab" data-tab="child" onclick="switchTab('child')">📅 아이</button>
    <button class="tab" data-tab="trip" onclick="switchTab('trip')">🌏 여행</button>
    <button class="tab" data-tab="estate" onclick="switchTab('estate')">🏢 부동산</button>
    <button class="tab" data-tab="pf" onclick="switchTab('pf')">📈 포트폴리오</button>
    <button class="tab" data-tab="eng" onclick="switchTab('eng')">🗣 영어</button>
  </div>
</header>

<div class="wrap">
  <div class="pane on" id="pane-home"><div class="state">불러오는 중…</div></div>
  <div class="pane" id="pane-kids"><div class="state">불러오는 중… (지점이 많아 20초쯤 걸려요)</div></div>
  <div class="pane" id="pane-child"><div class="state">불러오는 중…</div></div>
  <div class="pane" id="pane-trip"><div class="state">불러오는 중…</div></div>
  <div class="pane" id="pane-estate"><div class="state">불러오는 중…</div></div>
  <div class="pane" id="pane-pf"><div class="state">불러오는 중…</div></div>
  <div class="pane" id="pane-eng"><div class="state">불러오는 중…</div></div>
</div>

<script>
var DOW=["일","월","화","수","목","금","토"];
var loaded={home:false,kids:false,child:false,estate:false,pf:false,eng:false};
var current="home";
function p2(n){return ('0'+n).slice(-2);}

function switchTab(t){
  current=t;
  if(t!=="eng"&&typeof egStop==="function") egStop();
  ["home","kids","child","trip","estate","pf","eng"].forEach(function(k){
    document.getElementById("pane-"+k).classList.toggle("on",k===t);
  });
  document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.tab===t);});
  document.querySelector(".wrap").classList.toggle("wide",t==="trip");
  if(!loaded[t]) loadTab(t);
}
function reloadCurrent(){ loadTab(current); }
function loadTab(t){
  if(t==="home") loadHome();
  else if(t==="kids") loadKids();
  else if(t==="child") loadChild();
  else if(t==="trip") loadTrip();
  else if(t==="estate") loadEstate();
  else if(t==="pf") loadPf();
  else if(t==="eng") loadEng();
}
function busy(on){var b=document.getElementById("refresh");b.disabled=on;b.textContent=on?"조회 중…":"새로고침";}

/* ── 🏠 홈 ── */
var homeY,homeM,homeEvents={},selDate=null,pendingSel=null;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function loadHome(){
  if(!homeY){var n=new Date();homeY=n.getFullYear();homeM=n.getMonth()+1;}
  busy(true);
  document.getElementById("pane-home").innerHTML='<div class="state">불러오는 중…</div>';
  google.script.run.withSuccessHandler(function(d){
    document.getElementById("today").textContent=d.today+" 기준";
    homeCache[homeY+'-'+homeM]=d;
    renderHome(d);loaded.home=true;busy(false);
  }).withFailureHandler(function(e){
    document.getElementById("pane-home").innerHTML='<div class="state">조회 실패: '+e.message+
      '<br><br>최초 실행 시 캘린더 권한 승인이 필요할 수 있어요.</div>';busy(false);
  }).getHomeData(homeY,homeM);
}
// 월 이동은 캘린더 칸만 바꾼다(오른쪽 일정·기념일·메모는 그대로). 본 달은 기억해 뒀다가 바로 보여준다
var homeCache={};
function moveMonth(delta){
  homeM+=delta;if(homeM<1){homeM=12;homeY--;}if(homeM>12){homeM=1;homeY++;}
  var y=homeY,m=homeM,k=y+'-'+m, cal=document.querySelector('.cal');
  if(!cal||!document.getElementById('daypanel')){ loadHome(); return; }
  if(homeCache[k]) applyCal(homeCache[k]); else cal.style.opacity='.45';
  google.script.run.withSuccessHandler(function(d){
    homeCache[k]=d;
    if(y===homeY&&m===homeM) applyCal(d);
  }).withFailureHandler(function(e){
    var c=document.querySelector('.cal'); if(c) c.style.opacity='';
    if(y===homeY&&m===homeM&&!homeCache[k]) toast2('이 달 일정을 못 불러왔어요: '+e.message);
  }).getHomeData(y,m);
}
function toast2(msg){
  var t=document.getElementById('calToast');
  if(!t){ t=document.createElement('div'); t.id='calToast';
    t.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1f2733;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:999;max-width:90vw'; document.body.appendChild(t); }
  t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(function(){ t.style.display='none'; },4000);
}
function applyCal(d){
  homeEvents={};
  d.events.forEach(function(e){(homeEvents[e.date]=homeEvents[e.date]||[]).push(e);});
  var cal=document.querySelector('.cal'); if(!cal) return;
  cal.outerHTML=calHtml(d.today);
  var pre=homeY+'-'+p2(homeM)+'-';
  showDay(selDate&&selDate.indexOf(pre)===0?selDate:(d.today.indexOf(pre)===0?d.today:pre+'01'));
}
function renderHome(d){
  homeEvents={};
  d.events.forEach(function(e){(homeEvents[e.date]=homeEvents[e.date]||[]).push(e);});
  var right=
    '<div class="rc"><h3>📅 다가오는 일정</h3>'+
      '<div class="leg"><span><i class="lb"></i>반복</span><span><i class="lo"></i>일회성</span></div>'+

      '<textarea id="memoBox" placeholder="장보기·전달사항 등… 부부가 같이 씁니다">'+esc(d.memo.text)+'</textarea>'+
      '<div class="memobar"><button onclick="saveMemoNow(this)">저장</button>'+
      '<span class="mt" id="memoAt">'+(d.memo.at?'마지막 저장 '+d.memo.at:'')+'</span></div></div>';

    '<div id="daypanel" class="daypanel"></div></div>'+
    '<div class="homeright">'+right+'</div></div>';
  showDay(pendingSel||d.today);pendingSel=null;

function calHtml(today){
  var html='<div class="cal"><div class="calhd">'+
    '<button onclick="moveMonth(-1)">◀</button><span>'+homeY+'년 '+homeM+'월</span>'+
    '<button onclick="moveMonth(1)">▶</button></div><div class="calgrid">';
  DOW.forEach(function(w,i){html+='<div class="calw'+(i===0?' sun':'')+'">'+w+'</div>';});
  var startDow=new Date(homeY,homeM-1,1).getDay();
  var days=new Date(homeY,homeM,0).getDate();
  for(var i=0;i<startDow;i++) html+='<div class="calc empty"></div>';
  for(var n=1;n<=days;n++){
    var ds=homeY+'-'+p2(homeM)+'-'+p2(n);
    var dow=(startDow+n-1)%7;
    var evs=homeEvents[ds]||[];
    var dots=evs.length?'<div class="caldots">'+evs.slice(0,3).map(function(){return '<span class="dot"></span>';}).join('')+'</div>':'';
    html+='<div class="calc'+(ds===today?' today':'')+(dow===0?' sun':'')+'" data-d="'+ds+'" onclick="showDay(\''+ds+'\')">'+
      '<span class="cn">'+n+'</span>'+dots+'</div>';
  }
  return html+'</div></div>';
}
function upcomingHtml(list){
  if(!list.length) return '<div class="empty" style="padding:8px 0">2주간 일정 없음</div>';
  return list.map(function(e){
    var dt=new Date(e.date+"T00:00");
    return '<div class="up"><span class="ud">'+e.date.slice(5)+'('+DOW[dt.getDay()]+')</span>'+
      '<span class="ut">'+(e.allday?'종일':e.time)+'</span>'+
      '<span class="un'+(e.recur?'':' once')+'">'+e.title+'</span></div>';
  }).join("");
}
function showDay(ds){
  selDate=ds;
  var evs=homeEvents[ds]||[];
  var dt=new Date(ds+"T00:00");
  var body=evs.length?evs.map(function(e){
    return '<div class="dpev"><span class="tm">'+(e.allday?'종일':e.time)+'</span>'+
      '<span class="'+(e.recur?'':'once')+'">'+e.title+'</span></div>';
  }).join(""):'<div class="empty">일정 없음</div>';
  var add='<div class="dpadd"><input id="evTime" type="time">'+
    '<input id="evTitle" type="text" placeholder="일정 추가" onkeydown="if(event.key===\'Enter\')addEv(this)">'+
    '<button onclick="addEv(this)">+</button></div>';
  var p=document.getElementById("daypanel");
  if(p) p.innerHTML='<h4>'+ds.slice(5)+' ('+DOW[dt.getDay()]+') 일정</h4>'+body+add;
  document.querySelectorAll('.calc').forEach(function(c){c.classList.toggle('sel',c.dataset.d===ds);});

  var time=document.getElementById("evTime").value;
  var title=document.getElementById("evTitle").value.trim();
  if(!title){alert("일정 제목을 입력하세요");return;}
  var btn=el.tagName==="BUTTON"?el:el.parentNode.querySelector("button");
  btn.disabled=true;btn.textContent="…";
  google.script.run.withSuccessHandler(function(){
    pendingSel=selDate;loadHome();
  }).withFailureHandler(function(e){
    btn.disabled=false;btn.textContent="+";alert("추가 실패: "+e.message);
  }).addChildEvent(selDate,time,title);

function slotHtml(s,url){
  if(s.sn==="휴일") return '<span class="slot holi">휴일</span>';
  var head='<b>'+s.sn+'</b><span class="t">'+s.time+'</span>';
  var inner;
  if(s.cap===0) inner=head+'<span class="prog">프로그램</span>';
  else if(s.left>0){var low=s.left<=3?' low':'';inner=head+'<span class="left'+low+'">잔여'+s.left+'</span>';}
  else inner=head+'<span class="full">마감</span>';
  return '<a class="slot" href="'+url+'" target="_blank">'+inner+'</a>';
}

function loadChild(){
  busy(true);
  document.getElementById("pane-child").innerHTML='<div class="state">불러오는 중…</div>';
  google.script.run.withSuccessHandler(function(d){
    var today=new Date(d.today+"T00:00");
    var thisEnd=new Date(today.getTime()+(7-today.getDay())*86400000);
    var groups={this:[],next:[],later:[]};
    d.events.forEach(function(e){
      var dt=new Date(e.date+"T00:00");
      if(dt<thisEnd) groups.this.push(e);
      else if(dt<new Date(thisEnd.getTime()+7*86400000)) groups.next.push(e);
      else groups.later.push(e);
    });
    var html='<div class="hint">📱 폰에서 <b>구글 캘린더 앱</b>에 <b>아이</b> 캘린더로 일정을 넣으면 여기·홈에 자동 표시돼요.<br>'+
      '아내와 공유: 캘린더 웹 → 아이 캘린더 → 설정 → <b>특정 사용자와 공유</b> → 아내 이메일(변경 권한)</div>';
    function section(t,arr){return arr.length?'<div class="wk"><h3>'+t+'</h3>'+arr.map(evHtml).join("")+'</div>':'';}
    html+=section("이번 주",groups.this)+section("다음 주",groups.next)+section("그 이후",groups.later);
    if(!d.events.length) html+='<div class="empty" style="padding:20px">앞으로 2주간 등록된 일정이 없어요.</div>';
    document.getElementById("pane-child").innerHTML=html;loaded.child=true;busy(false);
  }).withFailureHandler(function(e){
    document.getElementById("pane-child").innerHTML='<div class="state">조회 실패: '+e.message+
      '<br><br>최초 실행 시 캘린더 권한 승인이 필요할 수 있어요.</div>';busy(false);

/* ── 💰 가용자산 · 얼마까지 살 수 있을까 (금액은 만원) ──
   가용자산 = (금호 최근 실거래가 − 세입자 보증금) + 이펜하우스 우리 몫 + 포트폴리오.
   대출은 서울 규제지역 기준: LTV 40% · 절대한도 · 스트레스 DSR 40%. 신용대출(영끌)은 한도 안에서 모자란 만큼만 쓴다. */
var reS = null;   // 시뮬레이터 상태(슬라이더 값)
function reMan(n){ n=Math.round(n||0); return n.toLocaleString('ko-KR'); }
function reEok(n){ return (Math.round(n/100)/100).toFixed(2).replace(/\.?0+$/,'')+'억'; }
function reF(rate, yrs){ var r=rate/100/12, n=yrs*12; return r/(1-Math.pow(1+r,-n)); }   // 월 상환계수(원리금균등)
function reAbsCap(P){ return P<=150000?60000:(P<=250000?40000:20000); }
function reCost(P){   // 취득세·중개보수·이사 등 부대비용 추정
  var acq=P<=60000?1.1:(P<=90000?(P/10000*2/3-3)*1.1:3.3);
  var br=(P<=90000?0.4:(P<=120000?0.5:(P<=150000?0.6:0.7)))*1.1;
  return P*(acq+br+0.3)/100;
}
function reInc(pl){ return pl.incomeH + pl.incomeW*(reS.wr/100); }   // 은행이 인정하는 부부 합산 연소득
function reDsrLoad(pl, m, X, yrs){   // 연 원리금(스트레스 금리 기준)
  var a=m*12*reF(pl.mortRate+pl.stress, yrs);
  var b=X*12*reF(pl.creditRate+(X>20000?pl.stress:0), 5);
  return a+b;
}
// 집값 P, 투입 자산 C, 영끌 여부로 대출을 짜 본다. 주담대를 먼저 쓰고 모자란 만큼만 신용대출로 채운다
function reFit(pl, P, C, yk, yrs){
  var need=P+reCost(P)-C, r={P:P, need:need, cost:reCost(P), m:0, X:0, ok:true, why:[]};
  if(need<=0){ r.extra=-need; return r; }
  var inc=reInc(pl), lim=pl.dsr/100*inc;
  var mmax=Math.min(P*pl.ltv/100, reAbsCap(P));
  var xcap=yk?Math.min(inc, 20000):0;
  for(var X=0; X<=xcap+1; X+=500){
    var x=Math.min(X,xcap), m=need-x;
    if(m<0){ m=0; x=need; }
    if(m<=mmax+0.5 && reDsrLoad(pl,m,x,yrs)<=lim){ r.m=m; r.X=x; return r; }
    if(x>=xcap) break;
  }
  // 못 맞춤 — 이유를 밝히려고 주담대만 최대로 쓴 경우를 기록
  var m2=Math.max(0,need-xcap);
  r.ok=false; r.m=Math.min(m2, mmax); r.X=Math.min(xcap, need-r.m);
  if(m2>mmax+0.5) r.why.push('LTV·절대한도(주담대 최대 '+reEok(mmax)+') 초과');
  if(reDsrLoad(pl,m2,Math.min(xcap,need-m2),yrs)>lim) r.why.push('DSR '+pl.dsr+'% 초과');
  if(!r.why.length) r.why.push('자금 부족');
  return r;
}
function reAvailHtml(d){
  var pl=d.plan; if(!pl||!pl.p) return '';
  var p=pl.p, own=pl.own, saved=null;
  try{ saved=JSON.parse(reGetLS_('re_sim','null')); }catch(e){}
  reS=saved||{ price:(own?own.price:90000), stock:true, yk:false, yrs:30, wr:p.wifeRate, ownP:0, use:-1, hp:0 };
  if(!(reS.wr>=0)) reS.wr=p.wifeRate;
  var h='<div class="re-avail"><h3>💰 가용자산 <span class="sub">(우리 돈 · 고정 + 포트폴리오)</span></h3><div id="reAvRows"></div>'
    +'<div class="re-sim" id="reSim">'
    +'<h3>🎚 얼마까지 살 수 있을까</h3>'
    +'<div class="sl"><label>사려는 집값 <b id="reHpV"></b></label><input type="range" id="reHp" min="20000" max="200000" step="1000"></div>'
    +'<div class="sl"><label>쓸 내 돈 <b id="reUseV"></b> <span class="mut" id="reUseMax"></span></label><input type="range" id="reUse" min="0" max="100000" step="500"></div>'
    +'<div class="opts"><label><input type="checkbox" id="reStock"> 주식 평가금액 포함</label>'
    +'<label class="yk"><input type="checkbox" id="reYk"> 🔥 영끌(신용대출 포함)</label>'
    +'<label>만기 <select id="reYrs"><option value="20">20년</option><option value="30">30년</option><option value="40">40년</option></select></label>'

}
function reAvailBind(d){
  var pl=d.plan; if(!pl||!pl.p||!reS) return;
  var st=function(){ reAvailCalc(d); };
  ['reHp','reUse','reStock','reYk','reYrs','reWr'].forEach(function(id){
    var el=document.getElementById(id);
    el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input', function(){
      if(id==='reHp') reS.hp=1;
      if(id==='reUse') reS.use=Number(el.value);
      if(id==='reStock') reS.stock=el.checked;
      if(id==='reYk') reS.yk=el.checked;
      if(id==='reYrs') reS.yrs=Number(el.value);
      if(id==='reWr') reS.wr=Math.max(0,Math.min(100,Number(el.value)||0));
      if(id==='reHp') reS.price=Number(el.value);
      st();
    });
  });
  document.getElementById('reHp').value=reS.price;
  document.getElementById('reStock').checked=reS.stock;
  document.getElementById('reYk').checked=reS.yk;
  document.getElementById('reYrs').value=reS.yrs;
  document.getElementById('reWr').value=reS.wr;
  reAvailCalc(d);
}
function reAvailCalc(d){
  var pl=d.plan, p=pl.p, own=pl.own, pf=pl.pf;
  var ownPrice=reS.ownP>0?reS.ownP:(own?own.price:0);
  var ownNet=Math.max(0, ownPrice-p.deposit);
  var pfv=pf.net-(reS.stock?0:pf.stock);
  var total=ownNet+p.jeonseOurs+pfv;
  var rows=
    '<div class="row"><span>🏢 금호(1차) <small>'+(own?('최근 실거래 '+own.date+' · '+own.area+'㎡ '+own.floor+'층'):'최근 실거래 없음')+'</small></span><b>'+reMan(ownPrice)+'</b></div>'
   +'<div class="row sub"><span>− 세입자 보증금</span><b>−'+reMan(p.deposit)+'</b></div>'
   +'<div class="row sub"><span>= 보유 부동산 순자산 <small>(양도세·중개비 제외)</small></span><b>'+reMan(ownNet)+'</b></div>'
   +'<div class="row"><span>🏠 신정이펜하우스4단지 <small>전세 보증금 '+reMan(p.jeonseTotal)+' 중 우리 몫</small></span><b>'+reMan(p.jeonseOurs)+'</b></div>'
   +'<div class="row"><span>📈 포트폴리오 <small>주식 '+reMan(pf.stock)+' · 예수금 '+reMan(pf.cash)+' · RP '+reMan(pf.rp)+(reS.stock?'':' (주식 제외)')+'</small></span><b>'+reMan(pfv)+'</b></div>'
   +'<div class="row tot"><span>가용자산 합계</span><b>'+reMan(total)+'만원 <small>('+reEok(total)+')</small></b></div>';
  document.getElementById('reAvRows').innerHTML=rows;

  // 슬라이더 범위
  var useEl=document.getElementById('reUse'), hpEl=document.getElementById('reHp');
  useEl.max=Math.max(500, Math.ceil(total/500)*500);
  var C=reS.use<0?Math.floor(total/500)*500:Math.min(reS.use,total);   // 건드리기 전엔 가용자산 전액
  useEl.value=C;
  var P=Number(hpEl.value);
  document.getElementById('reHpV').textContent=reEok(P);
  document.getElementById('reUseV').textContent=reEok(C);
  document.getElementById('reUseMax').textContent='(가용자산 '+reEok(total)+' 중)';
  reSetLS_('re_sim', JSON.stringify(reS));

  var f=reFit(p,P,C,reS.yk,reS.yrs);
  var inc=reInc(p), net=(p.incomeH+p.incomeW)*0.85/12;   // 월 실수령(세후 약 85%) 추정
  var mPay=f.m*reF(p.mortRate,reS.yrs), xPay=f.X*p.creditRate/100/12, pay=mPay+xPay;
  // 최대 집값 / 최소 내 돈
  var best=0, bestFit=null;
  for(var q=10000;q<=300000;q+=500){ var g=reFit(p,q,C,reS.yk,reS.yrs); if(g.ok){ best=q; bestFit=g; } }
  var minC=0;
  for(var c=0;c<=total+500;c+=500){ var g2=reFit(p,P,c,reS.yk,reS.yrs); if(g2.ok){ minC=c; break; } if(c>total) minC=-1; }
  var bestPay=bestFit?(bestFit.m*reF(p.mortRate,reS.yrs)+bestFit.X*p.creditRate/100/12):0;
  var cred=Math.min(inc,20000);
  var out=
    '<div class="b '+(f.ok?'ok':'bad')+'"><div class="lab">'+reEok(P)+' 집 — '+(f.ok?'가능 ✅':'불가 ❌')+'</div>'
      +'<div class="val">월 '+reMan(pay)+'만원</div>'
      +'<div class="sm">'+(f.ok?'월 실수령 약 '+reMan(net)+'만원의 '+Math.round(pay/net*100)+'%':esc(f.why.join(' · ')))+'</div></div>'
   +'<div class="b"><div class="lab">주담대</div><div class="val">'+reEok(f.m)+'</div><div class="sm">월 '+reMan(mPay)+'만 · 금리 '+p.mortRate+'% · '+reS.yrs+'년</div></div>'
   +(reS.yk?'<div class="b yk"><div class="lab">신용대출(영끌)</div><div class="val">'+reEok(f.X)+'</div><div class="sm">월 이자 '+reMan(xPay)+'만 · 금리 '+p.creditRate+'% · 한도 약 '+reEok(cred)+'</div></div>':'')
   +'<div class="b"><div class="lab">부대비용(추정)</div><div class="val">'+reEok(f.cost)+'</div><div class="sm">취득세·중개보수 등</div></div>'
   +'<div class="b big"><div class="lab">지금 내 돈 '+reEok(C)+'로 살 수 있는 최대 집값</div><div class="val">'+(best?reEok(best):'—')+'</div>'
      +'<div class="sm">'+(best?('월 '+reMan(bestPay)+'만원 · 주담대 '+reEok(bestFit.m)+(reS.yk&&bestFit.X?' + 신용 '+reEok(bestFit.X):'')):'조건에 맞는 집값이 없어요')+'</div></div>'
   +'<div class="b big"><div class="lab">'+reEok(P)+' 집을 사려면 최소 내 돈</div><div class="val">'+(minC>=0?reEok(minC):'가용자산으론 부족')+'</div>'
      +'<div class="sm">'+(minC>=0?('그때 주담대 '+reEok(reFit(p,P,minC,reS.yk,reS.yrs).m)):'')+'</div></div>';
  document.getElementById('reSimOut').innerHTML=out;
  document.getElementById('reSimNote').innerHTML=
    '인정 연소득 약 <b>'+reMan(inc)+'만원</b>(남편 정교사 17호봉 '+reMan(p.incomeH)+' + 아내 기간제 18호봉 '+reMan(p.incomeW)+'×'+reS.wr+'%) · DSR '+p.dsr+'% = 연 원리금 '+reMan(p.dsr/100*inc)+'만원, 스트레스 가산 +'+p.stress+'%p.<br>'
   +'서울 전역 규제지역(LTV '+p.ltv+'%, 주담대 15억↓ 6억 · 15~25억 4억 · 25억↑ 2억, 무주택자만) — <b>금호를 팔아 무주택이 된 뒤</b> 대출받는 걸 전제로 했어요. '
   +'신용대출은 인정소득 100%·부부 각 1억(총 2억) 안에서 모자란 만큼만 쓰고, 주택 구입 자금 용도 제한·1년 내 회수 같은 사후 규제는 은행마다 달라요. '
   +'금리는 '+p.asOf+' 5대 은행 평균(주담대 '+p.mortRate+'%·신용 '+p.creditRate+'%)이고 <b>참고용 추정</b>이라 실제 한도는 은행 사전심사로 꼭 확인하세요.';
}

var HS={W:820,H:300,pl:52,pr:106,pt:16,pb:30,bh:110};
var HS_BAR=[
  {k:'gain', nm:'익절', col:'#e5484d'},
  {k:'div',  nm:'배당', col:'#0f9d58'},
  {k:'loss', nm:'손절', col:'#2563eb'}
];
function man(v){ var a=Math.abs(v); return (v<0?'−':'+')+(a>=1e4?Math.round(a/1e4).toLocaleString()+'만':a.toLocaleString()); }
var HS_SER=[
  {k:'mine', nm:'내 계좌', sh:'내 계좌', col:'#6d28d9', w:2.6},
  {k:'kospi',nm:'코스피',  sh:'코스피',  col:'#d97706', w:2},

];
var histData=null, histTable=false, histRange='all';

// 보이는 구간의 첫 달을 0%로 다시 잡는다.
// 계좌는 연결수익률이라 (1+누적i)/(1+누적기준)−1 로 정확히 리베이스된다.
function histSlice(){
  var all=histData.points||[], p=all;
  if(histRange==='ytd'){
    var y=String(new Date().getFullYear());
    var f=all.filter(function(x){ return x.m.slice(0,4)===y; });
    if(f.length) p=f;
  }
  var bi=-1;
  for(var i=0;i<p.length;i++){ if(p[i].mine!=null){ bi=i; break; } }
  if(bi<0) bi=0;
  var bm=p.length?p[bi].mine:null, bk=p.length?p[bi].kospiRaw:null, bs=p.length?p[bi].snpRaw:null;
  return { base:p.length?p[bi].m:null, pts:p.map(function(x){
    return { m:x.m, net:x.net, flow:x.flow, at:x.at, gain:x.gain||0, loss:x.loss||0, div:x.div||0,
      mine: (x.mine==null||bm==null)?null:((1+x.mine/100)/(1+bm/100)-1)*100,
      kospi:(x.kospiRaw&&bk)?(x.kospiRaw/bk-1)*100:null,
      snp:  (x.snpRaw&&bs)  ?(x.snpRaw/bs-1)*100  :null };
  })};
}

function renderHist(){
  var w=document.getElementById('histWrap'); if(!w||!histData) return;
  var sl=histSlice(), p=sl.pts;

  // 범례에 쓸 현재값은 보이는 구간의 마지막 점
  var nw={};
  HS_SER.forEach(function(s){
    nw[s.k]=null;
    for(var i=p.length-1;i>=0;i--){ if(p[i][s.k]!=null){ nw[s.k]=p[i][s.k]; break; } }
  });

  var years={}; (histData.points||[]).forEach(function(x){ years[x.m.slice(0,4)]=1; });
  var multi=Object.keys(years).length>1;

  var sub = sl.base
    ? sl.base.slice(0,4)+'년 '+Number(sl.base.slice(5))+'월 = 0% 기준'
    : '기록 준비 중';
  var h='<div class="hs-card"><div class="hs-hd">'
    +'<h3>📈 수익률 추이 — 내 계좌 vs 시장</h3><span class="sub">'+sub+'</span>'
    +'<span class="acts">'
    +(multi?'<button class="'+(histRange==='ytd'?'on':'')+'" onclick="histSetRange(\'ytd\')">올해</button>'
           +'<button class="'+(histRange==='all'?'on':'')+'" onclick="histSetRange(\'all\')">전체</button>':'')
    +'<button onclick="histToggleTable()">'+(histTable?'▾ 표 닫기':'▸ 표·직접입력')+'</button>'
    +'<button onclick="histRefresh(this)">↻ 지수 갱신</button></span></div>';

  // 범례 — 3계열이라 항상 표시(색만으로 구분하지 않는다)
  h+='<div class="hs-leg">';
  HS_SER.forEach(function(s){
    var v=nw[s.k];
    h+='<span class="it"><span class="sw" style="background:'+s.col+'"></span>'
      +'<span class="nm">'+esc(s.nm)+'</span>'
      +'<span class="vl" style="color:'+(v==null?'#8a93a3':s.col)+'">'
      +(v==null?'—':pct(v))+'</span></span>';
  });
  h+='</div>';

  h+=histChart(p);

  var only1=p.filter(function(x){return x.mine!=null;}).length<2;
  if(only1){
    h+='<div class="hs-warn">계좌 기록이 아직 한 달치뿐이라 선이 그려지지 않습니다. '
      +'다음 달 1일에 점이 하나 더 찍히면 이어집니다. '
      +'증권사 앱에서 지난 달 잔고를 안다면 아래 <b>표·직접입력</b>에서 채워 넣으세요.</div>';
  }
  var src=histData.src||{};
  if(src.kospi==='fail'||src.snp==='fail'){
    h+='<div class="hs-warn">지수를 못 받아왔습니다 ('
      +(src.kospi==='fail'?'코스피 ':'')+(src.snp==='fail'?'S&P500':'')
      +'). ↻ 지수 갱신을 눌러보세요.</div>';
  }

  if(histTable) h+=histTableHtml(sl);

  h+='<div class="hs-note">매달 처음 이 화면을 열 때 그 달 점이 자동으로 찍힙니다. '
    +'계좌 수익률은 <b>입출금을 걷어낸 시간가중 방식</b>이라 돈을 더 넣어도 수익률이 부풀지 않습니다 '
    +'— 입금·출금한 달은 표에서 <b>순입금</b>만 적어주세요.</div>';
  h+='</div>';
  w.innerHTML=h;
}

// 카드 안에서 그래프가 실제로 쓸 수 있는 너비(px). .wrap·.hs-card 패딩을 뺀 값
function hsAvailW(){
  var el=document.querySelector('.wrap');
  var w=(el&&el.clientWidth)||window.innerWidth||360;
  return Math.max(260,Math.round(w-18*2-16*2));
}
function histChart(p){
  var n=p.length;
  if(!n) return '<div class="empty">기록이 없습니다.</div>';
  // 달이 적으면 화면 폭 그대로(스크롤 없음), 달이 많아지면 한 달당 최소 간격을 지켜 그만큼만 넓힌다
  var perPoint = n>16?42:(n>8?58:78);
  HS.W = Math.min(1600, Math.max(hsAvailW(), HS.pl+HS.pr+Math.max(1,n-1)*perPoint));

  // Y 범위 — 0%를 항상 포함하고 보기 좋은 눈금으로 맞춘다
  var lo=0, hi=0;
  p.forEach(function(x){ HS_SER.forEach(function(s){
    var v=x[s.k]; if(v==null) return;
    if(v<lo) lo=v; if(v>hi) hi=v;
  }); });
  if(hi-lo<2) hi=lo+2;
  var raw=(hi-lo)/5, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));
  var step=10*mag;
  [1,2,2.5,5,10].forEach(function(m){ if(m*mag>=raw && m*mag<step) step=m*mag; });
  // 눈금에 맞춰 넓히되 데이터 없는 쪽으로는 벌리지 않는다(아래가 텅 비는 것 방지)
  var dlo=lo, dhi=hi;
  lo=Math.floor(dlo/step)*step; hi=Math.ceil(dhi/step)*step;
  if(hi-dhi<step*0.25) hi+=step;   // 최고점이 축선에 딱 붙으면 한 칸 띄운다

  var iw=HS.W-HS.pl-HS.pr, ih=HS.H-HS.pt-HS.pb;
  var X=function(i){ return n===1 ? HS.pl+iw/2 : HS.pl+i*iw/(n-1); };
  var Y=function(v){ return HS.pt+(hi-v)/(hi-lo)*ih; };

  var g='', xs=[], ptY=[];
  for(var i=0;i<n;i++) xs.push(X(i));

  // 가로 눈금 (뒤로 물러나게)
  for(var t=lo;t<=hi+1e-9;t+=step){
    var zero=Math.abs(t)<1e-9, y=Y(t);
    g+='<line x1="'+HS.pl+'" y1="'+y.toFixed(1)+'" x2="'+(HS.W-HS.pr)+'" y2="'+y.toFixed(1)+'" '
      +'stroke="'+(zero?'#b9c0cc':'#eef1f5')+'" stroke-width="'+(zero?1.5:1)+'"'
      +(zero?' stroke-dasharray="5 4"':'')+'/>';
    g+='<text x="'+(HS.pl-9)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" '
      +'fill="'+(zero?'#6b7484':'#a6adba')+'">'+(t>0?'+':'')+(Math.round(t*10)/10)+'%</text>';
  }

  // X 라벨 — 해가 바뀌는 지점에만 연도를 붙인다
  var everyN = n>14?2:1;
  p.forEach(function(x,i){
    if(i%everyN!==0 && i!==n-1) return;
    var mm=Number(x.m.slice(5));
    var newYear = i>0 && x.m.slice(0,4)!==p[i-1].m.slice(0,4);
    g+='<text x="'+X(i).toFixed(1)+'" y="'+(HS.H-8)+'" text-anchor="middle" font-size="11" '
      +'fill="#a6adba">'+(newYear?x.m.slice(2,4)+'년 '+mm+'월':mm+'월')+'</text>';
  });

  // 내 계좌 영역 (0% 기준 위/아래) — 주인공 계열만
  var seg=[], area='';
  var flush=function(){
    if(seg.length>1){
      var d='M'+X(seg[0].i).toFixed(1)+' '+Y(0).toFixed(1)+' ';
      seg.forEach(function(q){ d+='L'+X(q.i).toFixed(1)+' '+Y(q.v).toFixed(1)+' '; });
      d+='L'+X(seg[seg.length-1].i).toFixed(1)+' '+Y(0).toFixed(1)+' Z';
      area+='<path d="'+d+'" fill="#6d28d9" opacity="0.09"/>';
    }
    seg=[];
  };
  p.forEach(function(x,i){ if(x.mine==null) flush(); else seg.push({i:i,v:x.mine}); });
  flush();
  g+=area;

  // 선 + 점
  var dots='';
  HS_SER.forEach(function(s){
    var d='', pen=false;
    p.forEach(function(x,i){
      var v=x[s.k];
      if(v==null){ pen=false; return; }
      d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';
      pen=true;
      dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="4" fill="'+s.col
         +'" stroke="#fff" stroke-width="2"/>';
    });
    if(d) g+='<path d="'+d+'" fill="none" stroke="'+s.col+'" stroke-width="'+s.w
          +'" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  g+=dots;

  for(var i2=0;i2<n;i2++){
    ptY.push(HS_SER.map(function(s){ return p[i2][s.k]==null?null:Y(p[i2][s.k]); }));
  }

  // 선 끝 직접 라벨 (겹치면 밀어냄)
  var labs=[];
  HS_SER.forEach(function(s,si){
    var li=-1;
    for(var i3=n-1;i3>=0;i3--){ if(p[i3][s.k]!=null){ li=i3; break; } }
    if(li<0) return;
    labs.push({s:s, x:X(li), y:Y(p[li][s.k]), v:p[li][s.k]});
  });
  labs.sort(function(a,b){ return a.y-b.y; });
  for(var i4=1;i4<labs.length;i4++){
    if(labs[i4].y-labs[i4-1].y<15) labs[i4].y=labs[i4-1].y+15;
  }
  labs.forEach(function(L){
    g+='<text x="'+(L.x+9).toFixed(1)+'" y="'+(L.y+4).toFixed(1)+'" font-size="11" '
      +'font-weight="700" fill="'+L.s.col+'">'+esc(L.s.sh)+' '+pct(L.v)+'</text>';
  });

  // 호버 레이어
  g+='<line id="hsCross" x1="0" y1="'+HS.pt+'" x2="0" y2="'+(HS.pt+ih)+'" stroke="#8a93a3" '
    +'stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
  HS_SER.forEach(function(s,si){
    g+='<circle id="hsH'+si+'" cx="0" cy="0" r="6.5" fill="'+s.col
      +'" stroke="#fff" stroke-width="2.5" opacity="0"/>';
  });

  window._hsGeo={xs:xs, ptY:ptY, W:HS.W}; window._hsPts=p;

  // 아래 막대판 — 월별 익절(위)·배당(위)·손절(아래), 원화. 선과 같은 X 에 맞춘다
  var up=0, dn=0;
  p.forEach(function(x){ up=Math.max(up,x.gain,x.div); dn=Math.max(dn,-x.loss); });
  var H=HS.H;
  if(up>0||dn>0){
    var top=HS.H+18, ph=HS.bh-34, z=top+ph*up/(up+dn), sc=ph/(up+dn);
    // 세 막대(익절·배당·손절)가 서로 겹치지 않게 한 그룹으로 묶어 나란히 놓는다
    var slot=iw/Math.max(n,1), bw=Math.max(5,Math.min(14,(slot-6)/3)), gap=Math.max(1,bw*0.18);
    var gw=bw*3+gap*2;
    g+='<text x="'+HS.pl+'" y="'+(top-6)+'" font-size="11" font-weight="700" fill="#6b7484">월별 익절·배당·손절 (원)</text>';
    g+='<line x1="'+HS.pl+'" y1="'+z.toFixed(1)+'" x2="'+(HS.W-HS.pr)+'" y2="'+z.toFixed(1)+'" stroke="#b9c0cc" stroke-width="1"/>';
    p.forEach(function(x,i){
      var cx=X(i), x0=cx-gw/2;
      [['gain',x0],['div',x0+bw+gap],['loss',x0+(bw+gap)*2]].forEach(function(b){
        var v=x[b[0]]; if(!v) return;
        var col=HS_BAR.filter(function(s){ return s.k===b[0]; })[0].col;
        var hgt=Math.max(1.5,Math.abs(v)*sc), y=v>0?z-hgt:z;
        g+='<rect x="'+b[1].toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" rx="2" fill="'+col+'"/>';
        g+='<text x="'+(b[1]+bw/2).toFixed(1)+'" y="'+(v>0?y-3:y+hgt+10).toFixed(1)+'" text-anchor="middle" font-size="9.5" fill="'+col+'">'+man(v)+'</text>';
      });
    });
    H=HS.H+HS.bh;
  }

  return '<div class="hs-plot" id="hsPlot" onmousemove="histMove(event)" '
    +'onmouseleave="histLeave()" ontouchmove="histTouch(event)" ontouchend="histLeave()">'
    +'<svg viewBox="0 0 '+HS.W+' '+H+'" style="width:'+HS.W+'px;height:'+H+'px;max-width:none" '
    +'role="img" aria-label="내 계좌와 코스피·S&amp;P500 월별 누적 수익률 비교">'+g+'</svg>'
    +'<div class="hs-tip" id="hsTip"></div></div>';
}
// 화면 폭이 바뀌면(회전·창 크기 조절) 그래프 너비도 다시 잰다
window.addEventListener('resize', function(){
  clearTimeout(window._hsRT);
  window._hsRT=setTimeout(function(){ if(histData&&document.getElementById('histWrap')) renderHist(); },250);
});

function histAt(clientX){
  var g=window._hsGeo, wrap=document.getElementById('hsPlot');
  if(!g||!wrap||!histData) return;
  var svg=wrap.querySelector('svg'); if(!svg) return;
  // 좁은 화면에선 svg 가 wrap 보다 넓고 가로 스크롤된다 — svg 기준으로 재야 맞다
  var r=svg.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
  var sc=r.width/g.W, dx=r.left-wr.left;
  var mx=(clientX-r.left)/sc, bi=0, bd=1e9;
  g.xs.forEach(function(x,i){ var dd=Math.abs(x-mx); if(dd<bd){ bd=dd; bi=i; } });

  var cross=document.getElementById('hsCross');
  if(cross){ cross.setAttribute('x1',g.xs[bi]); cross.setAttribute('x2',g.xs[bi]); cross.setAttribute('opacity','1'); }
  HS_SER.forEach(function(s,si){
    var c=document.getElementById('hsH'+si); if(!c) return;
    var y=g.ptY[bi][si];
    if(y==null){ c.setAttribute('opacity','0'); return; }
    c.setAttribute('cx',g.xs[bi]); c.setAttribute('cy',y); c.setAttribute('opacity','1');
  });

  var d=(window._hsPts||[])[bi], tip=document.getElementById('hsTip');
  if(!d) return;
  if(!tip) return;
  var t='<b>'+d.m.slice(0,4)+'년 '+Number(d.m.slice(5))+'월</b>';
  HS_SER.forEach(function(s){
    t+='<div class="tl"><span class="d" style="background:'+s.col+'"></span>'
      +'<span class="k">'+esc(s.nm)+'</span><span class="v">'
      +(d[s.k]==null?'—':pct(d[s.k]))+'</span></div>';
  });
  var ex=[];
  if(d.net!=null) ex.push('순자산 '+won(d.net));
  if(d.flow) ex.push('순입금 '+(d.flow>0?'+':'−')+won(Math.abs(d.flow)));
  if(d.at) ex.push(d.at+' 기록');
  if(ex.length) t+='<div class="ex">'+esc(ex.join(' · '))+'</div>';
  var bx=[];
  HS_BAR.forEach(function(s){ if(d[s.k]) bx.push(s.nm+' '+sellSign(d[s.k])); });
  if(bx.length) t+='<div class="ex">'+esc(bx.join(' · '))+'</div>';
  tip.innerHTML=t; tip.className='hs-tip on';
  var px=dx+g.xs[bi]*sc, lx=px+14;
  if(lx+tip.offsetWidth>wr.width) lx=px-tip.offsetWidth-14;
  tip.style.left=Math.max(0,Math.min(lx, wr.width-tip.offsetWidth))+'px';
  tip.style.top='6px';
}
function histMove(ev){ histAt(ev.clientX); }
function histTouch(ev){ if(ev.touches&&ev.touches[0]) histAt(ev.touches[0].clientX); }
function histLeave(){
  var c=document.getElementById('hsCross'); if(c) c.setAttribute('opacity','0');
  HS_SER.forEach(function(s,si){
    var e=document.getElementById('hsH'+si); if(e) e.setAttribute('opacity','0');
  });
  var t=document.getElementById('hsTip'); if(t) t.className='hs-tip';
}

/* 표 = 접근성용 대체 뷰 + 과거 잔고 직접 입력 */
function histTableHtml(sl){
  var byM={}; sl.pts.forEach(function(x){ byM[x.m]=x; });
  var only=(histRange==='ytd')?String(new Date().getFullYear()):null;
  var cur=(new Date()).getFullYear()+'-'+('0'+((new Date()).getMonth()+1)).slice(-2);
  var h='<table class="hs-tb"><thead><tr><th class="m">월</th><th>순자산(원)</th>'
    +'<th>순입금(원)</th><th>내 계좌</th><th>코스피</th><th>S&P 500</th><th></th></tr></thead><tbody>';
  (histData.rows||[]).forEach(function(r){
    if(only && r.m.slice(0,4)!==only) return;
    var p=byM[r.m]||{};
    h+='<tr'+(r.m===cur?' class="cur"':'')+'><td class="m">'+r.m+(r.m===cur?' <span style="color:#7c3aed">이번달</span>':'')+'</td>'
      +'<td><input id="hn_'+r.m+'" value="'+(r.net!=null?Number(r.net).toLocaleString():'')+'" placeholder="—"></td>'
      +'<td><input class="fl" id="hf_'+r.m+'" value="'+(r.flow?Number(r.flow).toLocaleString():'')+'" placeholder="0"></td>'
      +'<td class="'+plCls(p.mine||0)+'">'+(p.mine==null?'—':pct(p.mine))+'</td>'
      +'<td class="'+plCls(p.kospi||0)+'">'+(p.kospi==null?'—':pct(p.kospi))+'</td>'
      +'<td class="'+plCls(p.snp||0)+'">'+(p.snp==null?'—':pct(p.snp))+'</td>'
      +'<td><button class="sv" onclick="histSave(\''+r.m+'\')">저장</button></td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="hs-note">순자산 칸을 비우면 그 달은 계좌 라인에서 빠집니다. '
    +'이번 달 값은 매번 자동으로 덮어쓰지만, 손으로 저장하면 그 값이 유지됩니다.</div>';
  return h;
}

function histSave(m){
  var n=document.getElementById('hn_'+m), f=document.getElementById('hf_'+m);
  google.script.run.withSuccessHandler(function(d){
    histData=d; renderHist();
  }).withFailureHandler(function(e){ alert('저장 실패: '+e.message); })
  .hist_setRow({ m:m, net:(n?n.value.trim():''), flow:(f?f.value.trim():'') });
}

/* ── 📉 매도 성과 (실현손익) ── */

function loadSells(){
  google.script.run.withSuccessHandler(function(s){
    sellData=s; renderSells();
  }).withFailureHandler(function(e){
    var w=document.getElementById("sellWrap");
    if(w) w.innerHTML='<div class="pf-card">매도 기록 조회 실패: '+esc(e.message)+'</div>';
  }).sell_data();
}

function sellSign(v){ return (v>=0?'+':'−')+'₩'+Math.abs(Math.round(v)).toLocaleString(); }

  if(sellOpen){
    h+='<table class="sell-tb"><thead><tr><th>날짜</th><th>종목</th><th class="r">수량</th>'
      +'<th class="r">매수</th><th class="r">매도</th><th class="r">손익</th>'
      +'<th class="r">수익률</th><th></th></tr></thead><tbody>';
    rows.forEach(function(r){
      h+='<tr><td>'+r.date.slice(5)+'</td>'
        +'<td>'+esc(r.name)+(r.market==='US'?' <span class="mk-us">US</span>':'')
        +(r.memo?'<div class="sell-memo">'+esc(r.memo)+'</div>':'')+'</td>'
        +'<td class="r">'+r.qty+'</td>'
        +'<td class="r">'+(r.market==='US'?'$':'')+r.buy.toLocaleString()+'</td>'

/* 도넛 (inline SVG) */
function donutHtml(alloc){
  var total=0; alloc.forEach(function(a){total+=a.value;});
  if(total<=0) return '<div class="empty">데이터 없음</div>';
  var cx=70,cy=70,r=54,sw=26, C=2*Math.PI*r, off=0;
  var segs='';
  alloc.forEach(function(a,i){
    var frac=a.value/total, len=frac*C;
    var col=a.cash?'#c7cdd6':PF_COLORS[i%PF_COLORS.length].replace(/\s/g,'');
    segs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+col+'" '
       +'stroke-width="'+sw+'" stroke-dasharray="'+len+' '+(C-len)+'" '
       +'stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
    off+=len;
  });
  var svg='<svg width="140" height="140" viewBox="0 0 140 140">'+segs
     +'<text x="70" y="74" text-anchor="middle" font-size="12" fill="#8a93a3">총 '+ (Math.round(total)>=100000000?(total/1e8).toFixed(1)+'억':Math.round(total/1e4).toLocaleString()+'만') +'</text></svg>';
  var leg='<div class="legend">';
  alloc.forEach(function(a,i){
    var col=a.cash?'#c7cdd6':PF_COLORS[i%PF_COLORS.length].replace(/\s/g,'');
    var p=(a.value/total*100).toFixed(1);
    leg+='<div class="lgr"><span class="sw" style="background:'+col+'"></span>'
       +'<span class="lgn">'+esc(a.name)+'</span>'
       +'<span class="lgp">'+p+'%</span><span class="lgv">'+won(a.value)+'</span></div>';
  });
  leg+='</div>';
  return '<div class="donut-wrap">'+svg+leg+'</div>';
}

/* 종목별 수익률 가로 막대 */
function barsHtml(bars){
  if(!bars.length) return '<div class="empty">데이터 없음</div>';
  var max=1; bars.forEach(function(b){ max=Math.max(max,Math.abs(b.rate)); });
  var h='';
  bars.forEach(function(b){
    var w=Math.min(100,Math.abs(b.rate)/max*100);
    var pos=b.rate>=0;
    var col=pos?'var(--red)':'var(--blue)';
    // 중앙 0 기준 좌우
    h+='<div class="barrow"><span class="bn">'+esc(b.name)+'</span>'
      +'<div class="bt"><div class="bf" style="'+(pos?'left:50%':'right:50%')+';width:'+(w/2)+'%;background:'+col+'"></div>'
      +'<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)"></div></div>'
      +'<span class="bv '+plCls(b.rate)+'">'+pct(b.rate)+'</span></div>';
  });
  return h;
}

// 종목 추가매수(적립) — 평단·매입환율 가중평균 갱신
function pfBuyRow(btn){
  var tr=btn.closest('tr'), nx=tr.nextElementSibling;
  if(nx && nx.classList.contains('buylot')){ nx.remove(); return; }
  var isUs=tr.querySelector('.e-mk').value==='US';
  var cur=isUs?'$':'₩';
  var sub=document.createElement('tr'); sub.className='buylot';
  sub.innerHTML='<td colspan="7"><div class="lotbox">➕ 추가매수 · '
    +'수량<input class="b-q" type="number"> 단가('+cur+')<input class="b-p" type="number">'
    +(isUs?' 환율<input class="b-f" type="number" placeholder="예 1385">':'')
    +' 수수료('+cur+')<input class="b-fee" type="number" placeholder="0">'
    +(isUs?' 결제<select class="b-pay"><option value="usd">달러 예수금</option><option value="krw">원화(자동환전)</option></select>':'')
    +' <button class="lotap" onclick="pfBuyApply(this)">적용</button>'
    +' <button class="lotcx" onclick="this.closest(\'tr\').remove()">취소</button>'
    +' <span class="lotmsg"></span></div></td>';
  tr.parentNode.insertBefore(sub, tr.nextElementSibling);
}
function pfBuyApply(btn){
  var sub=btn.closest('tr'), tr=sub.previousElementSibling;
  var isUs=tr.querySelector('.e-mk').value==='US';
  var q=+sub.querySelector('.b-q').value, p=+sub.querySelector('.b-p').value;
  var f=isUs? (+ (sub.querySelector('.b-f')||{value:0}).value) : 0;
  var fee=+(sub.querySelector('.b-fee')||{value:0}).value||0;
  var msg=sub.querySelector('.lotmsg');
  if(!q||!p||(isUs&&!f)){ msg.textContent='수량·단가'+(isUs?'·환율':'')+' 입력'; return; }
  // 매수대금을 예수금에서 뺀다. 안 빼면 예수금이 실제보다 많게 남아 순자산이 부풀어 오른다.
  var pay=isUs? (sub.querySelector('.b-pay')||{value:'usd'}).value : 'krw';
  var cashEl=document.getElementById('pfCash'), usdEl=document.getElementById('pfCashUsd');
  var amt=q*p+fee;
  if(isUs && pay==='usd'){
    var cu=+usdEl.value||0, nu=Math.round((cu-amt)*100)/100;
    if(nu<0 && !confirm('달러 예수금이 $'+cu.toLocaleString()+' 뿐입니다.\n그래도 빼서 음수로 둘까요? (예수금 기록이 낡았을 수 있습니다)')) return;
    usdEl.value=nu;
  } else {
    var krwAmt=Math.round(isUs? amt*f : amt);
    var ck=+cashEl.value||0, nk=ck-krwAmt;
    if(nk<0 && !confirm('원화 예수금이 ₩'+ck.toLocaleString()+' 뿐입니다.\n그래도 빼서 음수로 둘까요? (예수금 기록이 낡았을 수 있습니다)')) return;
    cashEl.value=nk;
  }
  var qty=+tr.querySelector('.e-qt').value||0, avg=+tr.querySelector('.e-av').value||0, bfx=+tr.querySelector('.e-fx').value||0;
  var nq=qty+q, navg=(avg*qty + p*q)/nq;
  tr.querySelector('.e-qt').value=nq;
  tr.querySelector('.e-av').value=isUs? Math.round(navg*10000)/10000 : Math.round(navg);
  if(isUs){
    var wOld=avg*qty, wNew=p*q;
    var nbfx = (bfx>0 && (wOld+wNew)>0) ? (wOld*bfx + wNew*f)/(wOld+wNew) : f;
    tr.querySelector('.e-fx').value=Math.round(nbfx);
  }
  sub.remove();
}

function pfFxApply(){
  var box=document.getElementById('pfFxBox');

  if(!a||!f){ box.querySelector('.lotmsg').textContent='금액·환율 입력'; return; }
  var usd=+document.getElementById('pfCashUsd').value||0, cfx=+document.getElementById('pfCashUsdFx').value||0;

  {k:'tkt',re:/도쿄타워/g,n:'도쿄타워',q:'東京タワー',ll:[35.6586,139.7454]}
];
var tvRoutes={};
function tvMatch(s){
  var t=String(s||'').replace(/\([^)]*\)/g,''),best=null,bp=-1;
  TV_PLACES.forEach(function(p){
    p.re.lastIndex=0;var m;
    while((m=p.re.exec(t))){ if(m.index>bp){bp=m.index;best=p;} }
  });
  return best;
}
/* 일정 한 줄의 장소 — 추가할 때 찾은 좌표(ll)가 우선. 이미 아는 곳 400m 안이면 그 곳으로 합친다 */
function tvPlaceOf(it){
  if(it.ll){
    var near=null;
    TV_PLACES.forEach(function(p){
      var dy=(p.ll[0]-it.ll[0])*111,dx=(p.ll[1]-it.ll[1])*91;
      if(Math.sqrt(dx*dx+dy*dy)<0.4) near=p;
    });
    if(near) return near;
    return {k:'g'+it.ll[0].toFixed(4)+','+it.ll[1].toFixed(4),n:it.pn||it.title,q:it.pq||it.ll.join(','),ll:it.ll};
  }
  return tvMatch(it.title)||tvMatch(it.pq)||tvMatch(it.area);
}
function tvStops(items){
  var out=[];
  items.forEach(function(it){
    var p=tvPlaceOf(it);
    if(!p) return;
    var last=out[out.length-1];
    if(last&&last.p.k===p.k) return;
    out.push({p:p,t:it.time||''});
  });
  return out;
}
function tvGo(from,to){
  return 'https://www.google.com/maps/dir/?api=1'+(from?'&origin='+encodeURIComponent(from.q):'')+
    '&destination='+encodeURIComponent(to.q)+'&travelmode=transit';
}
function tripRouteMap(idx,items){
  var st=tvStops(items);
  if(st.length<2) return '';
  tvRoutes[idx]=st;
  var gm='https://www.google.com/maps/dir/'+st.map(function(s){return encodeURIComponent(s.p.q);}).join('/');
  var off=st.some(function(s){return s.p.air;})&&st.filter(function(s){return !s.p.air;}).length>=2;
  return '<div class="tv-map" id="tvMap'+idx+'"></div>'+
    '<div class="tv-mapbar">'+(off?'<span>✈ 공항 구간은 회색 점선(화면 밖)</span>':'<span>번호 = 가는 순서</span>')+
    '<a href="'+gm+'" target="_blank">구글맵에서 경로 열기 ↗</a></div>';
}
function tvMapsInit(){
  if(typeof L==='undefined') return;
  Object.keys(tvRoutes).forEach(function(idx){
    var el=document.getElementById('tvMap'+idx);
    if(!el||!el.offsetParent) return;
    if(el._tvMap){ el._tvMap.invalidateSize(); return; }
    var st=tvRoutes[idx];
    var map=L.map(el,{zoomControl:true,attributionControl:true,scrollWheelZoom:false,
      dragging:!L.Browser.mobile,tap:false});
    el._tvMap=map;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
    for(var i=1;i<st.length;i++){
      var a=st[i-1],b=st[i],air=a.p.air||b.p.air;
      L.polyline([a.p.ll,b.p.ll],{color:air?'#9aa3b2':'#2563eb',weight:air?2:4,opacity:air?.8:.85,
        dashArray:air?'4 6':null,className:air?'':'tv-ant'}).addTo(map);
    }
    var seen={};
    st.forEach(function(s,i){
      var g=seen[s.p.k];
      if(g){ g.nums.push(i+1);g.times.push(s.t);return; }
      seen[s.p.k]={p:s.p,nums:[i+1],times:[s.t]};
    });
    Object.keys(seen).forEach(function(k){
      var g=seen[k],lab=g.nums.join('·');
      var ic=L.divIcon({className:'',iconSize:null,
        html:'<div class="tv-pin'+(g.nums.length>1?' w':'')+(g.p.air?' air':'')+'">'+lab+'</div>'});
      L.marker(g.p.ll,{icon:ic}).addTo(map)
        .bindTooltip(g.p.n,{permanent:true,direction:'right',offset:[12,0],className:'tv-lb'})
        .bindPopup('<b>'+g.p.n+'</b><br>'+g.times.filter(Boolean).join(' · '));
    });
    var core=st.filter(function(s){return !s.p.air;});
    var pts=(core.length>=2?core:st).map(function(s){return s.p.ll;});
    map.fitBounds(pts,{padding:[28,28],maxZoom:14});
  });
}

<script>
/* ── 🗣 아빠표영어 ──
   보기 / 따라 말하기(문장마다 멈춤 → 아이가 말함 → 아이 목소리 다시 들려주기 → 칭찬) /
   반복 / 문장 나누기. 문장 구간은 서버에 저장돼 두 폰이 같이 쓴다. */
var eg={data:null, vid:null, mode:'watch', player:null, pend:null, timer:null, rate:1,
  segs:[], units:[], sel:0, dirty:false, cutStart:0,
  rep:{n:3, speed:1, on:false, left:0, timer:null},

function egA(s){ return esc(String(s==null?'':s)).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function egFind(id){ return ((eg.data&&eg.data.videos)||[]).filter(function(v){ return v.id===id; })[0]; }
function egFmt(t){ t=Math.max(0,t||0); var m=Math.floor(t/60), s=(t-m*60).toFixed(1); return m+':'+(s<10?'0':'')+s; }

  }).eng_data();
}

/* 진도·정렬·지표 — 해본(익숙한) 영상이 앞, 새 영상은 뒤 */
function egProg(id){ return ((eg.data&&eg.data.prog)||{})[id]||{}; }
function egLearned(v){ return !!egProg(v.id).done; }
// 「해본 영상」 = 따라 말한 기록이 한 문장이라도 있는 것. 학습완료 버튼을 안 눌러도 기록으로 알아서 앞에 온다
function egPracticed(v){ var p=egProg(v.id); return (p.k||0)>0||!!p.done; }
function egLv(m){
  if(!m) return 0;
  var s=m.wpsent/2+m.wps*1.5+m.uniq/12+m.sec/100;   // 문장 길이 · 말 속도 · 어휘 수 · 영상 길이
  return s<6?1:s<8?2:s<10?3:s<14?4:5;
}
function egSc(v){ var m=v.m; return m?m.wpsent/2+m.wps*1.5+m.uniq/12+m.sec/100:99; }
function egSortVids(vs){
  return vs.slice().sort(function(a,b){
    var la=egPracticed(a), lb=egPracticed(b); if(la!==lb) return la?-1:1;   // 익숙한 영상이 맨 앞(최근에 한 순)
    if(la){ var da=egProg(a.id).d||'', db=egProg(b.id).d||''; if(da!==db) return db.localeCompare(da); return (egProg(b.id).k||0)-(egProg(a.id).k||0); }
    var sa=a.stage==null?9:a.stage, sb=b.stage==null?9:b.stage; if(sa!==sb) return sa-sb;
    return egSc(a)-egSc(b);
  });
}
function egMin(s){ s=Math.round(s||0); return Math.floor(s/60)+':'+p2(s%60); }
function egMeta(v){
  var m=v.m, h='<div class="eg-meta">';
  if(egPracticed(v)){ var pg=egProg(v.id);
    h+='<span class="ok">🔁 해봄 · '+(pg.k||0)+'문장'+(pg.d?' · '+esc(pg.d.slice(5)):'')+(pg.done?' · 끝까지':'')+'</span>'; }
  if(m){
    var lv=egLv(m);
    h+='<span>⏱ '+egMin(m.sec)+'</span><span>문장 '+m.n+'</span><span>단어 '+m.words+'</span><span>어휘 '+m.uniq+'종</span>'
      +'<span title="문장 길이·말 속도·어휘 수·길이로 잰 언어 난이도">난이도 '+'●'.repeat(lv)+'○'.repeat(5-lv)+'</span>';
    h+='<span>문장당 '+m.wpsent+'단어 · 초당 '+m.wps+'</span>';
  } else if(v.n) h+='<span>문장 '+v.n+'</span>';
  return h+'</div>';
}

function renderEngHome(){
  egStop(); eg.vid=null;
  if(eg.queue){ eg.queue=null; eg.say.limit=eg.prevLimit||10; }
  if(eg.player){ try{ eg.player.destroy(); }catch(e){} eg.player=null; }
  var d=eg.data||{}, log=d.log||{}, logv=d.logv||{}, today=d.today||'';
  var ymd=function(i){ var dt=new Date(today+'T00:00'); dt.setDate(dt.getDate()-i); return dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate()); };
  var yk=ymd(1);
  var h='<div class="eg-top"><div class="eg-star" style="cursor:pointer" onclick="egStats()" title="월별 현황 보기">오늘 <b>'+(log[today]||0)+'</b>문장 🌟 <span style="font-size:13px;color:#64748b">· 어제 '+(log[yk]||0)+'문장</span><div style="font-size:11px;color:#2563eb;margin-top:2px">📊 눌러서 월별 현황</div></div><div class="eg-week" style="cursor:pointer" onclick="egStats()">';
  for(var i=6;i>=0;i--){
    var k=ymd(i), n=log[k]||0, dt=new Date(k+'T00:00');
    h+='<span><i>'+(n>=10?'🌟':(n>0?'⭐':'·'))+'</i>'+DOW[dt.getDay()]+'<em style="font-style:normal;font-size:10px">'+(n||'')+'</em></span>';
  }
  h+='</div></div>';
  var ys=logv[yk]||{}, yl=Object.keys(ys).map(function(id){ var v=egFind(id); return v?'<span>어제 · '+esc(v.title.split('|')[0].trim())+' '+ys[id]+'문장</span>':''; }).join('');
  if(yl) h+='<div class="eg-day">'+yl+'</div>';
  var nFam=(d.videos||[]).filter(egPracticed).length, nAll=(d.videos||[]).length;
  if(nAll) h+='<button class="eg-roadmap-btn" style="border-color:#bbf7d0;background:#f0fdf4;color:#166534" onclick="egPlaylist()">▶ 재생목록으로 이어서 하기 — 익숙한 영상 '+nFam+'개부터, 그다음 새 영상 '+(nAll-nFam)+'개</button>';
  h+='<button class="eg-roadmap-btn" onclick="egRoadmap()">🗺 바이링구얼 로드맵 — 단계별로 다음에 볼 영상 고르기</button>';
  h+='<div class="eg-add"><input id="egUrl" placeholder="유튜브 주소 붙여넣기 (슈퍼심플송·페파피그…)" autocomplete="off">'
    +'<button onclick="egAdd()">추가</button></div>';
  var vs=egSortVids(d.videos||[]);
  if(!vs.length){
    h+='<div class="empty">유튜브 앱에서 영상 → <b>공유</b> → <b>링크 복사</b> → 위 칸에 붙여넣기.<br>'
      +'2~3분짜리 짧은 노래부터 시작하면 좋아요.</div>';
  } else {
    var fam=vs.filter(egPracticed).length;
    h+='<div class="eg-note" style="margin:0 0 8px">초록 테두리 = 해본 영상('+fam+'개, 맨 앞 · 최근에 한 순) · 파란 테두리 = 새 영상(쉬운 단계 순). 따라 말한 기록으로 알아서 나뉘어요</div>';
    h+='<div class="eg-grid">';
    vs.forEach(function(v){
      var dn=egPracticed(v), si=v.stage!=null?egStageInfo(v.stage):null;
      h+='<div class="eg-card '+(dn?'fam':'todo')+'" onclick="egOpen(\''+egA(v.id)+'\')">'
        +'<img loading="lazy" src="https://i.ytimg.com/vi/'+egA(v.yt)+'/mqdefault.jpg" alt="" '
        +'onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/'+egA(v.yt)+'/hqdefault.jpg\'">'
        +'<div class="play"><span>'+(dn?'✓':'▶')+'</span></div>'
        +'<button class="x" title="삭제" onclick="event.stopPropagation();egDel(\''+egA(v.id)+'\')">✕</button>'
        +'<div class="t">'+esc(v.title)+'</div>'
        +'<div class="s">'+(si?si.emoji+' '+si.stage+'단계 · ':'')+esc(v.ch)+'</div>'
        +'<div class="s2">'+(v.n?'문장 '+v.n+'개'+(v.m?' · 어휘 '+v.m.uniq+'종 · 난이도 '+egLv(v.m)+'/5':''):'<span class="new">열면 문장을 자동으로 나눠요</span>')+'</div></div>';
    });
    h+='</div>';
  }
  h+='<div class="eg-note">🗣 <b>따라 말하기</b> — 한 문장씩 멈추면 아이가 따라 말하고, 방금 말한 걸 <b>아이 목소리로 다시 들려줘요</b>. '
    +'문장 나누기(챱)는 자막으로 <b>자동</b>이에요 — 틀린 곳만 ✂ 에서 고치세요.</div>';
  document.getElementById('pane-eng').innerHTML=h;
}

/* 📊 월별 학습 현황 팝업 — 홈의 오늘/주간 별을 누르면 열린다 */
function egStats(ym){
  var d=eg.data||{}, today=d.today||'', log=d.log||{};
  ym=ym||today.slice(0,7);
  var y=Number(ym.slice(0,4)), m=Number(ym.slice(5,7));
  var mm=(d.logm||{})[ym];
  if(!mm&&!egStatsBusy){
    egStatsBusy=true;
    google.script.run.withSuccessHandler(function(r){
      egStatsBusy=false; d.logm=d.logm||{}; d.logm[ym]=(r&&r.m)||{}; egStats(ym);
    }).withFailureHandler(function(){ egStatsBusy=false; d.logm=d.logm||{}; d.logm[ym]={}; egStats(ym); }).eng_month(ym);
    mm={};
  }
  mm=mm||{};
  var first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate(), total=0, active=0, best=0, cells='';
  for(var i=0;i<first;i++) cells+='<i></i>';
  for(var dd=1;dd<=days;dd++){
    var k=ym+'-'+p2(dd), n=log[k]||0; total+=n; if(n) active++; if(n>best) best=n;
    cells+='<b class="'+(n>=10?'s2':(n>0?'s1':''))+(k===today?' t':'')+'"><u>'+dd+'</u>'+(n?'<em>'+n+'</em>':'')+'</b>';
  }
  var vids=Object.keys(mm).map(function(id){ var v=egFind(id); return v?[v.title.split('|')[0].trim(),mm[id]]:null; })
    .filter(Boolean).sort(function(a,b){ return b[1]-a[1]; });
  var fin=((d.videos)||[]).filter(function(v){ var p=egProg(v.id); return p.done&&(p.d||'').slice(0,7)===ym; });
  var isNow=ym===today.slice(0,7), pm=new Date(y,m-2,1), nm=new Date(y,m,1);
  var pk=pm.getFullYear()+'-'+p2(pm.getMonth()+1), nk=nm.getFullYear()+'-'+p2(nm.getMonth()+1);
  var h='<div class="eg-stat-box" onclick="event.stopPropagation()">'
    +'<div class="eg-stat-hd"><button onclick="egStats(\''+pk+'\')">‹</button><b>'+y+'년 '+m+'월</b>'
    +'<button '+(isNow?'disabled':'onclick="egStats(\''+nk+'\')"')+'>›</button><button class="x" onclick="egStatsClose()">✕</button></div>'
    +'<div class="eg-stat-sum"><div><b>'+total+'</b>문장</div><div><b>'+active+'</b>일 함</div><div><b>'+(active?Math.round(total/active):0)+'</b>하루 평균</div><div><b>'+best+'</b>최고 하루</div></div>'
    +'<div class="eg-stat-cal"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>'+cells+'</div>'
    +'<div class="eg-stat-sec">🎬 이 달에 한 영상</div>'
    +(vids.length?vids.map(function(x){ return '<div class="eg-stat-row"><span>'+esc(x[0])+'</span><b>'+x[1]+'문장</b></div>'; }).join(''):'<div class="eg-note">영상별 기록은 이번 개편 이후부터 쌓여요.</div>')
    +'<div class="eg-stat-sec">✅ 이 달에 끝낸 영상 '+fin.length+'개</div>'
    +fin.map(function(v){ return '<div class="eg-stat-row"><span>'+esc(v.title.split('|')[0].trim())+'</span><b>'+esc((egProg(v.id).d||'').slice(5))+'</b></div>'; }).join('')
    +'<div class="eg-note">전체 학습: '+((d.videos||[]).filter(egLearned).length)+' / '+((d.videos||[]).length)+'개 영상 완료 · 문장 기록은 최근 120일까지 남아요</div></div>';
  var o=document.getElementById('egStat');
  if(!o){ o=document.createElement('div'); o.id='egStat'; o.className='eg-stat'; o.onclick=egStatsClose; document.body.appendChild(o); }
  o.innerHTML=h; o.classList.add('on');
}
var egStatsBusy=false;
function egStatsClose(){ var o=document.getElementById('egStat'); if(o) o.classList.remove('on'); }

/* ▶ 재생목록 — 안 한 영상을 쉬운 단계 순으로 이어서. 영상 첫 광고는 직접 건너뛰고 ▶ 시작 */
function egPlaylist(){
  var q=egSortVids((eg.data&&eg.data.videos)||[]).map(function(v){ return v.id; });   // 익숙한 영상 → 새 영상 순
  if(!q.length){ alert('영상이 없어요. 유튜브 링크를 먼저 추가해 주세요'); return; }
  eg.queue=q; eg.prevLimit=eg.say.limit; eg.say.limit=999;   // 재생목록은 영상 하나를 끝까지
  egOpen(q[0]);
}
function egQueueNext(){
  if(!eg.queue) return;
  var cur=eg.vid&&eg.vid.id, i=eg.queue.indexOf(cur), nx=null;
  for(var j=i+1;j<eg.queue.length;j++){ var v=egFind(eg.queue[j]); if(v){ nx=v.id; break; } }
  if(!nx){ alert('재생목록 끝! 오늘도 수고했어요 🌟'); renderEngHome(); return; }
  if(eg.dirty&&!confirm('나눈 문장을 저장하지 않았어요. 그냥 넘어갈까요?')) return;
  egOpen(nx);
}

function egAdd(){
  var u=document.getElementById('egUrl').value.trim(); if(!u) return;
  busy(true);
  google.script.run.withSuccessHandler(function(d){
    busy(false); if(d&&d.error){ alert(d.error); return; }
    eg.data=d; renderEngHome();
  }).withFailureHandler(function(e){ busy(false); alert('추가 실패: '+e.message); }).eng_addVideo(u);
}
function egDel(id){
  var v=egFind(id); if(!v||!confirm('「'+v.title+'」을(를) 지울까요?\n나눠둔 문장도 같이 지워져요.')) return;
  busy(true);
  google.script.run.withSuccessHandler(function(d){ busy(false); eg.data=d; renderEngHome(); })
    .withFailureHandler(function(e){ busy(false); alert(e.message); }).eng_delVideo(id);
}

   chunk)부터 · Whitehurst 대화형 읽기(질문으로 이해 확인) · 이 시기 침묵기(silent period)는
   정상이라 산출을 억지로 끌어내지 않는다. 영상만으로 균형 바이링구얼이 되진 않는다 — 여기서

function egScript(v){

}
function egScriptHtml(v){
  var s=egScript(v), h='<div class="eg-script">';
  if(s.phrases.length){
    h+='<div class="eg-sc-h">🎯 목표 표현</div><div class="eg-sc-ph">'+s.phrases.map(function(p){
      return '<span><b>'+esc(p[0])+'</b><i>'+esc(p[1])+'</i></span>'; }).join('')+'</div>';
  }
  h+='<div class="eg-sc-h">▶️ 틀기 전</div><div class="eg-sc-p">'+esc(s.before)+'</div>';
  h+='<div class="eg-sc-h">👀 보는 중</div><ul class="eg-sc-ul">'+s.during.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';

var egOpenScript={};   // videoId → 지도안 펼침 여부
var egOpenStage={};    // 단계 → 펼침 여부(안 건드렸으면 「지금 단계」만 펼침)
function egToggleScript(id){ egOpenScript[id]=!egOpenScript[id]; egRoadmap(true); }
function egAssignStage(id, sel){
  var st=sel.value===''?null:Number(sel.value);
  busy(true);
  google.script.run.withSuccessHandler(function(d){ busy(false); eg.data=d; egRoadmap(true); })
    .withFailureHandler(function(e){ busy(false); alert(e.message); }).eng_setStage(id, st);
}
function egRoadmapAdd(stage){
  var inp=document.getElementById('egrAdd'+stage), u=inp.value.trim(); if(!u) return;
  egAddTo(u, stage);
}
function egAddTo(u, stage, after){
  busy(true);
  google.script.run.withSuccessHandler(function(d){
    busy(false); if(d&&d.error){ alert(d.error); return; }
    eg.data=d; if(after) after(); egRoadmap(true);
  }).withFailureHandler(function(e){ busy(false); alert('추가 실패: '+e.message); }).eng_addVideo(u, stage);
}
function egToggleDone(id, on){
  busy(true);
  google.script.run.withSuccessHandler(function(d){ busy(false); eg.data=d; if(eg.vid) egOpenHead(); else egRoadmap(true); })
    .withFailureHandler(function(e){ busy(false); alert(e.message); }).eng_setDone(id, on);
}
function egFind2(stage){ return egSortVids(((eg.data&&eg.data.videos)||[]).filter(function(v){ return v.stage===stage; })); }
// 지금 단계 = 아직 안 한 영상이 남은 가장 낮은 단계
function egCurStage(){
  var vs=(eg.data&&eg.data.videos)||[];
  for(var s=0;s<=5;s++){ if(vs.some(function(v){ return v.stage===s&&!egPracticed(v); })) return s; }
  return 0;
}

function egStageJump(n){

function egRoadmap(keepScroll){
  var y=keepScroll?window.scrollY:0;

  var h='<button class="eg-back" onclick="renderEngHome()">‹ 영상 목록</button>';
  h+='<div class="eg-rd-intro"><h3>🗺 바이링구얼 로드맵</h3>'
